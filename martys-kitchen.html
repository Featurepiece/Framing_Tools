<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Marty's Kitchen - Help Dad Build!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a1a2e; display:flex; flex-direction:column;
    align-items:center; justify-content:center; min-height:100vh;
    font-family:'Press Start 2P',monospace; overflow:hidden;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #gameCanvas { display:block; image-rendering:pixelated; border:3px solid #e6a817; border-radius:4px; }
  #hud {
    display:flex; justify-content:space-between; width:100%; max-width:520px;
    padding:8px 12px; color:#e6a817; font-size:9px; letter-spacing:1px;
  }
  #controls {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; max-width:520px; padding:10px 8px 20px; gap:10px;
  }
  .ctrl-btn {
    background:rgba(230,168,23,0.15); border:2px solid #e6a817; color:#e6a817;
    font-family:'Press Start 2P',monospace; font-size:18px; border-radius:12px;
    width:70px; height:70px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .ctrl-btn:active, .ctrl-btn.active { background:rgba(230,168,23,0.4); }
  #dpad { display:flex; gap:6px; }
  @media(min-width:600px){ #controls { display:none; } }
</style>
</head>
<body>
<div id="hud">
  <span>TOOLS: <span id="toolsDisplay">0</span>/5</span>
  <span>BUMPS: <span id="bumpsDisplay">0</span>/3</span>
  <span>TIME: <span id="timeDisplay">0</span>s</span>
  <span>BEST: <span id="bestDisplay">-</span></span>
</div>
<canvas id="gameCanvas" width="448" height="540"></canvas>
<div id="controls">
  <div id="dpad">
    <div id="btnLeft" class="ctrl-btn">&#9664;</div>
    <div id="btnRight" class="ctrl-btn">&#9654;</div>
  </div>
  <div id="btnJump" class="ctrl-btn">JUMP</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const BASE_W = 448;
const BASE_H = 540;

function getScale() {
  const maxW = Math.min(window.innerWidth, 520);
  const maxH = window.innerHeight - 220;
  return Math.min(maxW / BASE_W, maxH / BASE_H, 1);
}
function resize() {
  canvas.width = BASE_W; canvas.height = BASE_H;
  const s = getScale();
  canvas.style.width = (BASE_W*s)+'px';
  canvas.style.height = (BASE_H*s)+'px';
}
resize();
window.addEventListener('resize', resize);

// =====================================================
// COLOURS
// =====================================================
const COL = {
  sky: '#87CEEB', grass: '#4a8c3f', grassDark: '#3a7030',
  platform: '#8B7355', platformTop: '#a08660',
  martyShirt: '#e04040', martyJeans: '#3355aa', martySkin: '#f5c5a3',
  martyHair: '#4a3520',
  connShirt: '#30a030', connJeans: '#3355aa', connSkin: '#f5c5a3', connHair: '#8B4513',
  sheepBody: '#f0ece0', sheepFace: '#222', sheepLegs: '#555',
  cabinet: '#b08050', worktop: '#666',
  speechBubble: '#fff', speechText: '#222', starYellow: '#ffd700',
  shelfWood: '#a07040', shelfDark: '#805530',
};

// =====================================================
// STATE
// =====================================================
const STATE = { TITLE:'title', PLAYING:'playing', WIN:'win', INITIALS:'initials' };
let gameState = STATE.TITLE;
let frameCount = 0, toolsDelivered = 0, totalTime = 0, bestTime = null;
let gameTimer = 0, currentToolIndex = 0, carryingTool = false;
let sheepBumps = 0, dropFlashTimer = 0, titleBounce = 0;
let parachuting = false;
let pickupFlashTimer = 0;

// =====================================================
// LEADERBOARD
// =====================================================
const BLOB_ID = '019ce410-29da-718d-b354-a8fc7464aaec';
const BLOB_URL = 'https://jsonblob.com/api/jsonBlob/' + BLOB_ID;
let leaderboard = []; // [{initials:'CON', time:45}, ...]
let playerInitials = '';
let initialsCursor = 0; // which letter (0-2) we're entering
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let selectedLetterIndex = 0; // which letter in ALPHABET is highlighted

// Load leaderboard on page load
async function loadLeaderboard() {
  try {
    const res = await fetch(BLOB_URL, {
      headers: { 'Accept': 'application/json' }
    });
    if (res.ok) {
      const data = await res.json();
      leaderboard = (data.scores || []).sort((a,b) => a.time - b.time).slice(0, 5);
    }
  } catch(e) { console.log('Could not load leaderboard:', e); }
}

async function saveLeaderboard(initials, time) {
  try {
    leaderboard.push({ initials, time });
    leaderboard.sort((a,b) => a.time - b.time);
    leaderboard = leaderboard.slice(0, 5);
    await fetch(BLOB_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ scores: leaderboard })
    });
  } catch(e) { console.log('Could not save leaderboard:', e); }
}

loadLeaderboard();
const MAX_BUMPS = 3;
const PARACHUTE_SPEED = 1.2;

// =====================================================
// SOUND EFFECTS — Web Audio API synthesized sounds
// =====================================================
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function sfxJump() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

function sfxDoubleJump() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

function sfxPickup() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(500, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

function sfxDeliver() {
  try {
    const ctx = getAudio();
    // Happy ascending arpeggio
    [0, 0.1, 0.2].forEach((t, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime([523, 659, 784][i], ctx.currentTime + t);
      gain.gain.setValueAtTime(0.18, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + t + 0.15);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.15);
    });
  } catch(e) {}
}

function sfxBaa() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200 + Math.random() * 80, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

function sfxBonk() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.12);
  } catch(e) {}
}

function sfxDrop() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

function sfxWin() {
  try {
    const ctx = getAudio();
    [0, 0.12, 0.24, 0.36, 0.5].forEach((t, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime([523, 659, 784, 1047, 1318][i], ctx.currentTime + t);
      gain.gain.setValueAtTime(0.18, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + t + 0.2);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.2);
    });
  } catch(e) {}
}

let footstepTimer = 0;
function sfxFootstep() {
  try {
    const ctx = getAudio();
    // Soft noise burst - like a little tap
    const bufferSize = ctx.sampleRate * 0.04; // 40ms
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize);
    }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, ctx.currentTime);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
    source.start(ctx.currentTime);
  } catch(e) {}
}

const TOOLS = [
  { name: 'HAMMER', color: '#888', handleCol: '#c08040' },
  { name: 'DRILL', color: '#e04040', handleCol: '#444' },
  { name: 'SAW', color: '#aaa', handleCol: '#c08040' },
  { name: 'TAPE MEASURE', color: '#ffd700', handleCol: '#ffd700' },
  { name: 'SPIRIT LEVEL', color: '#40cc40', handleCol: '#ffd700' },
];

// =====================================================
// TOOL SHELF — bottom-left on ground
// =====================================================
const SHELF = { x: 16, y: 476, w: 50, h: 22 };

// =====================================================
// PLATFORMS — ZIGZAG ROUTING (verified, no cheese paths)
// Single jump: ~75px height, ~85px horizontal
// Double jump: ~140px height, ~130px horizontal
// Route: Ground(right) -> P1(right) -> P2(centre) -> P3(far left) -> 
//        P4(left-centre stepping stone) -> [DOUBLE JUMP] -> P5a(centre) ->
//        P5b(right) -> TOP
// =====================================================
const platforms = [
  // 0: Ground
  { x: 0, y: 500, w: BASE_W, h: 40 },

  // 1: P1 "Launchpad" — far right
  { x: 325, y: 440, w: 100, h: 12 },

  // 2: P2 "Centre Ledge" — centre
  { x: 165, y: 385, w: 90, h: 12 },

  // 3: P3 "Far Left" — extended (was P3+P4 combined)
  { x: 10, y: 330, w: 145, h: 12 },

  // 4: P5a "Double Jump Landing" — wider, needs double jump from P3
  { x: 190, y: 240, w: 90, h: 12 },

  // 5: P5b "Final Step" — far right, clear air above to jump left onto TOP
  { x: 350, y: 170, w: 80, h: 12 },

  // 6: TOP "Marty's Platform" — shorter, right side clear for P5b approach
  { x: 30, y: 100, w: 250, h: 14 },
];

// =====================================================
// PLAYER — with double jump
// =====================================================
let player = {
  x: 60, y: 476, w: 18, h: 24,
  vx: 0, vy: 0, onGround: false,
  facing: 1, frame: 0, walking: false,
  jumpsLeft: 2,   // 2 = can jump, 1 = can double jump, 0 = used both
  doubleJumpUsed: false,
  prevY: 476,     // previous frame Y for one-way platform check
};

// =====================================================
// MARTY — bigger model (30x36)
// =====================================================
const marty = { x: 45, y: 68, w: 30, h: 36, speechTimer: 0, shouting: true };

let toolSpawn = { x: 0, y: 0, visible: false };

// =====================================================
// SHEEP
// =====================================================
let sheep = [];
function spawnSheep() {
  sheep = [];
  const candidates = [1,3,4];
  const available = [...candidates];
  for (let i = 0; i < 3 && available.length > 0; i++) {
    const idx = Math.floor(Math.random() * available.length);
    const pi = available[idx];
    available.splice(idx, 1);
    const p = platforms[pi];
    if (p.w < 65) continue;
    sheep.push({
      x: p.x + 10 + Math.random() * (p.w - 44),
      y: p.y - 16, w: 24, h: 16,
      vx: (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.4),
      platform: pi, baaTimer: 0, frame: 0,
    });
  }
}

// =====================================================
// INPUT
// =====================================================
const keys = {}, prevKeys = {};
const touch = { left: false, right: false, jump: false };
let prevTouchJump = false;
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
function keyPressed(c) { return keys[c] && !prevKeys[c]; }
function setupTouch(id, prop) {
  const el = document.getElementById(id);
  if (!el) return;
  const on = () => { touch[prop] = true; el.classList.add('active'); };
  const off = () => { touch[prop] = false; el.classList.remove('active'); };
  el.addEventListener('touchstart', e => { e.preventDefault(); on(); });
  el.addEventListener('touchend', e => { e.preventDefault(); off(); });
  el.addEventListener('touchcancel', () => off());
  el.addEventListener('mousedown', e => { e.preventDefault(); on(); });
  el.addEventListener('mouseup', () => off());
  el.addEventListener('mouseleave', () => off());
}
setupTouch('btnLeft', 'left');
setupTouch('btnRight', 'right');
setupTouch('btnJump', 'jump');

// =====================================================
// TOOL SPAWN — shelf
// =====================================================
function spawnTool() {
  toolSpawn.x = SHELF.x + SHELF.w / 2;
  toolSpawn.y = SHELF.y - 4;
  toolSpawn.visible = true;
  carryingTool = false;
  sheepBumps = 0;
  marty.shouting = true;
  marty.speechTimer = 0;
}

// =====================================================
// COLLISION
// =====================================================
function rectOverlap(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function platformCheck(entity) {
  entity.onGround = false;
  for (const p of platforms) {
    // Horizontal overlap check
    if (entity.x + entity.w > p.x+4 && entity.x < p.x+p.w-4) {
      const headNow = entity.y;
      const headPrev = entity.prevY;
      const feetNow = entity.y + entity.h;
      const feetPrev = entity.prevY + entity.h;
      const platTop = p.y;
      const platBottom = p.y + p.h;

      // LANDING ON TOP: falling down, feet were above platform top last frame
      if (entity.vy >= 0 && feetPrev <= platTop && feetNow >= platTop) {
        entity.y = platTop - entity.h;
        entity.vy = 0;
        entity.onGround = true;
        return;
      }

      // HEAD BUMP: moving up, head hits underside of platform
      // Head was below platform bottom last frame, now head is inside or above it
      if (entity.vy < 0 && headPrev >= platBottom && headNow < platBottom) {
        entity.y = platBottom; // push head back down to bottom of platform
        entity.vy = 0;        // stop upward movement — bonk!
        sfxBonk();
      }
    }
  }
}

// =====================================================
// UPDATE
// =====================================================
const GRAVITY = 0.4;
const MOVE_SPEED = 2.4;
const JUMP_FORCE = -8.0;
const DOUBLE_JUMP_FORCE = -7.5;

// Double jump particle effects
let djParticles = [];

function updatePlayer() {
  // === PARACHUTE MODE ===
  if (parachuting) {
    const moveLeft = keys['ArrowLeft'] || keys['KeyA'] || touch.left;
    const moveRight = keys['ArrowRight'] || keys['KeyD'] || touch.right;
    player.vx = 0;
    player.walking = false;
    if (moveLeft) { player.vx = -MOVE_SPEED * 0.6; player.facing = -1; }
    if (moveRight) { player.vx = MOVE_SPEED * 0.6; player.facing = 1; }
    
    // Gentle sway
    player.vx += Math.sin(frameCount * 0.05) * 0.3;
    
    // Slow descent
    player.vy = PARACHUTE_SPEED;
    player.x += player.vx;
    player.y += player.vy;
    
    // Boundaries
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > BASE_W) player.x = BASE_W - player.w;
    
    // Check if landed on ground (platform 0, y=400)
    if (player.y + player.h >= 500) {
      player.y = 500 - player.h;
      player.vy = 0;
      player.onGround = true;
      parachuting = false;
      player.jumpsLeft = 2;
      player.doubleJumpUsed = false;
      // Spawn next tool on the shelf
      spawnTool();
    }
    
    if (dropFlashTimer > 0) dropFlashTimer--;
    return; // skip normal movement
  }

  // === NORMAL MODE ===
  player.prevY = player.y; // save for one-way platform check
  const moveLeft = keys['ArrowLeft'] || keys['KeyA'] || touch.left;
  const moveRight = keys['ArrowRight'] || keys['KeyD'] || touch.right;
  const jumpPress = keyPressed('Space') || keyPressed('ArrowUp') || keyPressed('KeyW') || (touch.jump && !prevTouchJump);

  player.vx = 0;
  player.walking = false;
  if (moveLeft) { player.vx = -MOVE_SPEED; player.facing = -1; player.walking = true; }
  if (moveRight) { player.vx = MOVE_SPEED; player.facing = 1; player.walking = true; }

  if (jumpPress) {
    if (player.onGround) {
      // First jump
      player.vy = JUMP_FORCE;
      player.onGround = false;
      player.jumpsLeft = 1;
      player.doubleJumpUsed = false;
      sfxJump();
    } else if (player.jumpsLeft > 0 && !player.doubleJumpUsed) {
      // Double jump!
      player.vy = DOUBLE_JUMP_FORCE;
      player.jumpsLeft = 0;
      player.doubleJumpUsed = true;
      sfxDoubleJump();
      // Spawn puff particles
      for (let i = 0; i < 6; i++) {
        djParticles.push({
          x: player.x + player.w/2,
          y: player.y + player.h,
          vx: (Math.random()-0.5) * 3,
          vy: Math.random() * 2 + 1,
          life: 20 + Math.random()*10,
        });
      }
    }
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > BASE_W) player.x = BASE_W - player.w;
  if (player.y > BASE_H) { player.y = 476; player.vy = 0; }

  platformCheck(player);

  // Reset jumps when landing
  if (player.onGround) {
    player.jumpsLeft = 2;
    player.doubleJumpUsed = false;
  }

  if (player.walking) {
    player.frame += 0.15;
    // Footstep sounds when on ground
    if (player.onGround) {
      footstepTimer++;
      if (footstepTimer >= 10) { // every 10 frames (~6 per second)
        sfxFootstep();
        footstepTimer = 0;
      }
    }
  } else {
    footstepTimer = 0;
  }
  if (dropFlashTimer > 0) dropFlashTimer--;
  if (pickupFlashTimer > 0) pickupFlashTimer--;

  // Update double jump particles
  for (let i = djParticles.length-1; i >= 0; i--) {
    const p = djParticles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) djParticles.splice(i, 1);
  }

  // Pick up tool — must walk right up to the shelf
  if (toolSpawn.visible && !carryingTool) {
    const tr = { x: toolSpawn.x-10, y: toolSpawn.y-10, w: 20, h: 20 };
    const pr = { x: player.x, y: player.y, w: player.w, h: player.h };
    if (rectOverlap(pr, tr)) {
      carryingTool = true;
      toolSpawn.visible = false;
      sheepBumps = 0;
      sfxPickup();
      pickupFlashTimer = 40; // flash "GOT IT!" briefly
    }
  }

  // Deliver to Marty
  if (carryingTool && !parachuting) {
    const mr = { x: marty.x-10, y: marty.y-5, w: marty.w+20, h: marty.h+10 };
    const pr = { x: player.x, y: player.y, w: player.w, h: player.h };
    if (rectOverlap(pr, mr)) {
      toolsDelivered++;
      carryingTool = false; sheepBumps = 0;
      marty.shouting = false; marty.speechTimer = 0;
      currentToolIndex++;
      if (toolsDelivered >= TOOLS.length) {
        gameState = STATE.WIN;
        totalTime = Math.floor(gameTimer/60);
        if (bestTime === null || totalTime < bestTime) bestTime = totalTime;
        sfxWin();
      } else {
        sfxDeliver();
        // Parachute back down!
        parachuting = true;
        player.vy = 0;
      }
    }
  }

  // Sheep collision
  for (const s of sheep) {
    const sr = { x: s.x, y: s.y, w: s.w, h: s.h };
    const pr = { x: player.x, y: player.y, w: player.w, h: player.h };
    if (rectOverlap(pr, sr)) {
      if (player.x < s.x) player.x -= 3; else player.x += 3;
      if (s.baaTimer <= 0) {
        s.baaTimer = 60;
        sfxBaa();
        if (carryingTool) {
          sheepBumps++;
          if (sheepBumps >= MAX_BUMPS) {
            carryingTool = false; sheepBumps = 0;
            dropFlashTimer = 90;
            sfxDrop();
            setTimeout(() => {
              if (gameState === STATE.PLAYING && !carryingTool) spawnTool();
            }, 500);
          }
        }
      }
    }
  }
}

function updateSheep() {
  for (const s of sheep) {
    const p = platforms[s.platform];
    s.x += s.vx; s.frame += 0.05;
    if (s.x < p.x+5) { s.x = p.x+5; s.vx = Math.abs(s.vx); }
    if (s.x+s.w > p.x+p.w-5) { s.x = p.x+p.w-5-s.w; s.vx = -Math.abs(s.vx); }
    if (Math.random() < 0.005) s.vx = -s.vx;
    if (Math.random() < 0.003) s.vx = (Math.random()>0.5?1:-1)*(0.3+Math.random()*0.4);
    if (s.baaTimer > 0) s.baaTimer--;
  }
}

function updateMarty() { marty.speechTimer++; }

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(0.75, '#c8e6f0');
  grad.addColorStop(1, '#4a8c3f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const cx = (frameCount*0.2)%(BASE_W+100)-50;
  drawCloud(cx, 25, 40);
  drawCloud((cx+200)%(BASE_W+100)-50, 50, 30);
  drawCloud((cx+350)%(BASE_W+100)-50, 15, 35);
}
function drawCloud(x, y, sz) {
  ctx.beginPath();
  ctx.arc(x, y, sz*0.4, 0, Math.PI*2);
  ctx.arc(x+sz*0.3, y-sz*0.2, sz*0.35, 0, Math.PI*2);
  ctx.arc(x+sz*0.6, y, sz*0.38, 0, Math.PI*2);
  ctx.arc(x+sz*0.3, y+sz*0.1, sz*0.3, 0, Math.PI*2);
  ctx.fill();
}

function drawPlatforms() {
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    if (i === 0) {
      ctx.fillStyle = COL.grass;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = COL.grassDark;
      ctx.fillRect(p.x, p.y, p.w, 4);
      ctx.fillStyle = '#5a9c4f';
      for (let gx = 10; gx < p.w; gx += 20) {
        ctx.fillRect(p.x+gx, p.y-2, 3, 4);
        ctx.fillRect(p.x+gx+6, p.y-1, 2, 3);

    } else {
      ctx.fillStyle = COL.platform;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = COL.platformTop;
      ctx.fillRect(p.x, p.y, p.w, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      for (let gx = p.x+8; gx < p.x+p.w; gx += 16) ctx.fillRect(gx, p.y+4, 8, 2);

}

function drawConn(p) {
  const x = Math.floor(p.x), y = Math.floor(p.y), f = p.facing;
  const bob = p.walking ? Math.sin(p.frame*4)*1.5 : 0;
  const leg = p.walking ? Math.sin(p.frame*4)*3 : 0;

  // Legs
  ctx.fillStyle = COL.connJeans;
  ctx.fillRect(x+3, y+16+bob, 5, 8+leg*0.3);
  ctx.fillRect(x+10, y+16+bob, 5, 8-leg*0.3);
  // Body
  ctx.fillStyle = COL.connShirt;
  ctx.fillRect(x+2, y+8+bob, 14, 10);
  // Head
  ctx.fillStyle = COL.connSkin;
  ctx.fillRect(x+4, y+bob, 10, 10);
  // Hair
  ctx.fillStyle = COL.connHair;
  ctx.fillRect(x+3, y-1+bob, 12, 4);
  // Eyes
  ctx.fillStyle = '#222';
  if (f > 0) ctx.fillRect(x+9, y+3+bob, 2, 2);
  else ctx.fillRect(x+7, y+3+bob, 2, 2);
  // Smile
  ctx.fillStyle = '#c06050';
  ctx.fillRect(x+8, y+7+bob, 3, 1);

  // Carrying tool
  if (carryingTool && currentToolIndex < TOOLS.length) {
    drawToolIcon(x+4, y-14+bob, TOOLS[currentToolIndex], true);
    if (frameCount%10 < 5) {
      ctx.fillStyle = COL.starYellow;
      ctx.fillRect(x+1, y-16+bob, 2, 2);
      ctx.fillRect(x+15, y-12+bob, 2, 2);
    }
  }

  // Bump warning dots
  if (carryingTool && sheepBumps > 0) {
    for (let i = 0; i < sheepBumps; i++) {
      ctx.fillStyle = i < 2 ? '#ff8800' : '#ff0000';
      ctx.fillRect(x+2+i*6, y-22+bob, 4, 4);
    }
  }

  // Double jump indicator — small dot under Conn when he can still double jump
  if (!player.onGround && player.jumpsLeft > 0 && !player.doubleJumpUsed && !parachuting) {
    ctx.fillStyle = '#66ffff';
    ctx.globalAlpha = 0.5 + Math.sin(frameCount*0.2)*0.3;
    ctx.beginPath();
    ctx.arc(x+9, y+26+bob, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // === PARACHUTE ===
  if (parachuting) {
    const sway = Math.sin(frameCount * 0.05) * 4;
    const cx = x + 9; // centre of Conn
    const canopyY = y - 28;
    const canopyW = 36;
    
    // Strings
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 2, y - 1);
    ctx.lineTo(cx - canopyW/2 + sway, canopyY + 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 2, y - 1);
    ctx.lineTo(cx + canopyW/2 + sway, canopyY + 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, y - 1);
    ctx.lineTo(cx + sway, canopyY + 4);
    ctx.stroke();

    // Canopy — nice colourful dome
    ctx.beginPath();
    ctx.ellipse(cx + sway, canopyY, canopyW/2, 12, 0, Math.PI, 0);
    ctx.fillStyle = '#e04040';
    ctx.fill();
    ctx.strokeStyle = '#c03030';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Canopy stripes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(cx + sway, canopyY, canopyW/2, 12, 0, Math.PI, Math.PI + Math.PI/3);
    ctx.lineTo(cx + sway - 4, canopyY);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(cx + sway, canopyY, canopyW/2, 12, 0, Math.PI + Math.PI*2/3, 0);
    ctx.lineTo(cx + sway + 4, canopyY);
    ctx.fill();
  }
}

function drawSpeechBubble(x, y, text) {
  ctx.font = '7px "Press Start 2P"';
  const mw = ctx.measureText(text).width;
  const bw = mw+14, bh = 18;
  const bx = x-bw/2, by = y-bh;
  // Clamp to screen
  const cbx = Math.max(2, Math.min(bx, BASE_W - bw - 2));

  ctx.fillStyle = COL.speechBubble;
  ctx.beginPath(); ctx.roundRect(cbx, by, bw, bh, 4); ctx.fill();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = COL.speechBubble;
  ctx.beginPath();
  ctx.moveTo(x-4, by+bh); ctx.lineTo(x, by+bh+6); ctx.lineTo(x+4, by+bh);
  ctx.fill();
  ctx.fillStyle = COL.speechText;
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText(text, cbx + bw/2, by+12);
  ctx.textAlign = 'left';
  if (frameCount%40 < 20 && marty.shouting) {
    ctx.fillStyle = 'rgba(255,0,0,0.1)';
    ctx.beginPath(); ctx.roundRect(cbx, by, bw, bh, 4); ctx.fill();
  }
}

function drawToolIcon(x, y, tool, small) {
  const s = small ? 0.7 : 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (tool.name === 'HAMMER') {
    ctx.fillStyle = tool.handleCol; ctx.fillRect(2, 4, 4, 14);
    ctx.fillStyle = tool.color; ctx.fillRect(-1, 0, 12, 6);
  } else if (tool.name === 'DRILL') {
    ctx.fillStyle = tool.handleCol; ctx.fillRect(2, 6, 10, 8);
    ctx.fillStyle = tool.color; ctx.fillRect(0, 2, 8, 8);
    ctx.fillStyle = '#aaa'; ctx.fillRect(8, 5, 8, 3);
  } else if (tool.name === 'SAW') {
    ctx.fillStyle = tool.handleCol; ctx.fillRect(0, 2, 6, 8);
    ctx.fillStyle = tool.color; ctx.fillRect(5, 4, 14, 4);
    ctx.fillStyle = '#888';
    for (let i = 0; i < 5; i++) ctx.fillRect(6+i*3, 8, 2, 2);
  } else if (tool.name === 'TAPE MEASURE') {
    ctx.fillStyle = tool.color;
    ctx.beginPath(); ctx.arc(7, 7, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#444';
    ctx.beginPath(); ctx.arc(7, 7, 3, 0, Math.PI*2); ctx.fill();
  } else if (tool.name === 'SPIRIT LEVEL') {
    ctx.fillStyle = tool.handleCol; ctx.fillRect(0, 4, 18, 6);
    ctx.fillStyle = tool.color; ctx.fillRect(6, 5, 6, 4);
    ctx.fillStyle = '#66ee66'; ctx.fillRect(8, 6, 2, 2);
  }
  ctx.restore();
}

  ctx.moveTo(x, y-28+ab); ctx.lineTo(x-5, y-22+ab); ctx.lineTo(x+5, y-22+ab);

}

function drawSheep(s) {
  const x = Math.floor(s.x), y = Math.floor(s.y);

  ctx.ellipse(x+12, y+6+bob, 13, 8, 0, 0, Math.PI*2);

  ctx.arc(x+4, y+3+bob, 5, 0, Math.PI*2);
  ctx.arc(x+12, y+1+bob, 5, 0, Math.PI*2);
  ctx.arc(x+20, y+3+bob, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = COL.sheepFace;
  const fx = facing > 0 ? x+20 : x;
  ctx.fillRect(fx, y+2+bob, 6, 8);

    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}

  ctx.fillRect(mx+4, my+32, 8, 4); ctx.fillRect(mx+18, my+32, 8, 4);
  // Head
  ctx.fillStyle = COL.martySkin; ctx.fillRect(mx+5, my, 20, 14);
  ctx.fillStyle = COL.martyHair; ctx.fillRect(mx+4, my-2, 22, 5);
  // Title glasses
  ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.roundRect(mx+7, my+4, 8, 6, 1.5); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(mx+17, my+4, 8, 6, 1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx+15, my+6); ctx.lineTo(mx+17, my+6); ctx.stroke();
  ctx.fillStyle = 'rgba(100,160,220,0.2)';
  ctx.beginPath(); ctx.roundRect(mx+7, my+4, 8, 6, 1.5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(mx+17, my+4, 8, 6, 1.5); ctx.fill();
  // Eyes
  ctx.fillStyle = '#222';
  ctx.fillRect(mx+10, my+6, 2, 2); ctx.fillRect(mx+20, my+6, 2, 2);
  // Smile
  ctx.fillStyle = '#c06050'; ctx.fillRect(mx+12, my+11, 6, 2);

  for (let i = 0; i < TOOLS.length; i++) drawToolIcon(100+i*60, 270, TOOLS[i], false);

  if (Math.floor(frameCount/30)%2 === 0) {
    ctx.fillStyle = '#ffd700'; ctx.font = '11px "Press Start 2P"';
    ctx.fillText('PRESS SPACE OR TAP JUMP', BASE_W/2, 310);
  }

  // Leaderboard
  drawLeaderboardOnTitle();

  ctx.textAlign = 'left';
}

// =====================================================
// WIN SCREEN
// =====================================================
function drawWin() {
  drawSky(); drawPlatforms(); drawShelf();
  drawKitchenProgress(); drawMarty(); drawConn(player);
  sheep.forEach(drawSheep);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  ctx.fillStyle = COL.starYellow;
  for (let i = 0; i < 20; i++) {
    const sx = (frameCount*0.5+i*67)%BASE_W;
    const sy = (i*43+Math.sin(frameCount*0.05+i)*20)%(BASE_H-50);
    ctx.fillRect(sx, sy, 3, 3);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700'; ctx.font = '20px "Press Start 2P"';
  ctx.fillText('KITCHEN DONE!', BASE_W/2, 160);
  ctx.fillStyle = '#fff'; ctx.font = '12px "Press Start 2P"';
  ctx.fillText('Great job helping Dad!', BASE_W/2, 200);
  ctx.font = '14px "Press Start 2P"';
  ctx.fillText('TIME: '+totalTime+' seconds', BASE_W/2, 240);
  if (bestTime !== null) {
    ctx.fillStyle = '#ffd700'; ctx.font = '10px "Press Start 2P"';
    ctx.fillText('BEST: '+bestTime+'s', BASE_W/2, 270);
  }
  if (frameCount%40 < 25) {
    ctx.fillStyle = '#ffd700'; ctx.font = '10px "Press Start 2P"';
    ctx.fillText('PRESS SPACE TO CONTINUE', BASE_W/2, 310);
  }
  ctx.textAlign = 'left';
}

// =====================================================
// INITIALS ENTRY SCREEN
// =====================================================
function drawInitials() {
  // Dark background
  const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
  grad.addColorStop(0, '#1a1a3e'); grad.addColorStop(1, '#0a0a1e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // Stars background
  ctx.fillStyle = COL.starYellow;
  for (let i = 0; i < 15; i++) {
    const sx = (frameCount*0.3+i*73)%BASE_W;
    const sy = (i*47+Math.sin(frameCount*0.04+i)*15)%(BASE_H-50);
    const sz = Math.sin(frameCount*0.1+i)*1+2;
    ctx.fillRect(sx, sy, sz, sz);
  }

  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = '#ffd700'; ctx.font = '16px "Press Start 2P"';
  ctx.fillText('WELL DONE!', BASE_W/2, 80);

  ctx.fillStyle = '#fff'; ctx.font = '11px "Press Start 2P"';
  ctx.fillText('TIME: ' + totalTime + ' seconds', BASE_W/2, 115);

  ctx.fillStyle = '#ffaa44'; ctx.font = '12px "Press Start 2P"';
  ctx.fillText('ENTER YOUR INITIALS', BASE_W/2, 160);

  // Show entered letters + cursor
  const boxSize = 36;
  const boxGap = 12;
  const totalW = boxSize*3 + boxGap*2;
  const startX = (BASE_W - totalW) / 2;
  const boxY = 180;

  for (let i = 0; i < 3; i++) {
    const bx = startX + i*(boxSize+boxGap);
    // Box
    ctx.fillStyle = i === initialsCursor ? 'rgba(255,215,0,0.2)' : 'rgba(255,255,255,0.1)';
    ctx.strokeStyle = i === initialsCursor ? '#ffd700' : '#555';
    ctx.lineWidth = 2;
    ctx.fillRect(bx, boxY, boxSize, boxSize);
    ctx.strokeRect(bx, boxY, boxSize, boxSize);
    // Letter
    if (i < playerInitials.length) {
      ctx.fillStyle = '#fff'; ctx.font = '20px "Press Start 2P"';
      ctx.fillText(playerInitials[i], bx + boxSize/2, boxY + 26);
    } else if (i === initialsCursor) {
      // Blinking cursor letter
      ctx.fillStyle = '#ffd700'; ctx.font = '20px "Press Start 2P"';
      if (frameCount%30 < 20) {
        ctx.fillText(ALPHABET[selectedLetterIndex], bx + boxSize/2, boxY + 26);
      }
    }
  }

  // Alphabet selector
  const alphaY = 250;
  ctx.font = '9px "Press Start 2P"';

  // Show a window of 9 letters centred on selection
  const windowSize = 9;
  const halfWin = Math.floor(windowSize/2);
  const letterW = 32;
  const alphaStartX = (BASE_W - windowSize*letterW) / 2;

  for (let i = 0; i < windowSize; i++) {
    const li = (selectedLetterIndex - halfWin + i + 26) % 26;
    const lx = alphaStartX + i*letterW + letterW/2;
    const isCurrent = (i === halfWin);

    if (isCurrent) {
      // Highlight current letter
      ctx.fillStyle = 'rgba(255,215,0,0.3)';
      ctx.fillRect(lx-14, alphaY-12, 28, 22);
      ctx.fillStyle = '#ffd700'; ctx.font = '14px "Press Start 2P"';
      ctx.fillText(ALPHABET[li], lx, alphaY+6);
    } else {
      const dist = Math.abs(i - halfWin);
      ctx.globalAlpha = 1 - dist*0.15;
      ctx.fillStyle = '#888'; ctx.font = '9px "Press Start 2P"';
      ctx.fillText(ALPHABET[li], lx, alphaY+4);
      ctx.globalAlpha = 1;
    }
  }

  // Arrows
  ctx.fillStyle = '#ffd700'; ctx.font = '14px "Press Start 2P"';
  ctx.fillText('\u25C0', alphaStartX - 10, alphaY+5);
  ctx.fillText('\u25B6', alphaStartX + windowSize*letterW + 10, alphaY+5);

  // Instructions
  ctx.fillStyle = '#888'; ctx.font = '7px "Press Start 2P"';
  ctx.fillText('\u25C0 \u25B6 TO CHOOSE     JUMP TO CONFIRM', BASE_W/2, 290);

  // Show current leaderboard below
  if (leaderboard.length > 0) {
    ctx.fillStyle = '#ffaa44'; ctx.font = '9px "Press Start 2P"';
    ctx.fillText('- HIGH SCORES -', BASE_W/2, 330);
    ctx.font = '8px "Press Start 2P"';
    for (let i = 0; i < leaderboard.length && i < 5; i++) {
      const s = leaderboard[i];
      const medal = i === 0 ? '\u2605 ' : '  ';
      ctx.fillStyle = i === 0 ? '#ffd700' : '#ccc';
      ctx.fillText(medal + s.initials + '  ' + s.time + 's', BASE_W/2, 355 + i*20);
    }
  }

  ctx.textAlign = 'left';
}

// =====================================================
// DRAW LEADERBOARD ON TITLE SCREEN
// =====================================================
function drawLeaderboardOnTitle() {
  if (leaderboard.length === 0) return;
  const startY = 410;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffaa44'; ctx.font = '8px "Press Start 2P"';
  ctx.fillText('- HIGH SCORES -', BASE_W/2, startY);
  ctx.font = '7px "Press Start 2P"';
  for (let i = 0; i < leaderboard.length && i < 5; i++) {
    const s = leaderboard[i];
    ctx.fillStyle = i === 0 ? '#ffd700' : '#ccc';
    const medal = i === 0 ? '\u2605 ' : (i+1) + '. ';
    ctx.fillText(medal + s.initials + '  ' + s.time + 's', BASE_W/2, startY + 18 + i*16);
  }
  ctx.textAlign = 'left';
}

// =====================================================
// GAME LOOP
// =====================================================
function startGame() {
  try { getAudio().resume(); } catch(e) {}
  toolsDelivered = 0; currentToolIndex = 0;
  carryingTool = false; sheepBumps = 0; dropFlashTimer = 0; pickupFlashTimer = 0; gameTimer = 0;
  parachuting = false;
  djParticles = [];
  player.x = 60; player.y = 476; player.vx = 0; player.vy = 0;
  player.onGround = true; player.jumpsLeft = 2; player.doubleJumpUsed = false;
  player.prevY = 476;
  spawnSheep(); spawnTool();
  gameState = STATE.PLAYING;
}

function update() {
  frameCount++;
  if (gameState === STATE.TITLE) {
    if (keyPressed('Space') || keyPressed('Enter') || (touch.jump && !prevTouchJump)) startGame();
  } else if (gameState === STATE.PLAYING) {
    gameTimer++;
    updatePlayer(); updateSheep(); updateMarty();
  } else if (gameState === STATE.WIN) {
    if (keyPressed('Space') || keyPressed('Enter') || (touch.jump && !prevTouchJump)) {
      // Go to initials entry
      gameState = STATE.INITIALS;
      playerInitials = '';
      initialsCursor = 0;
      selectedLetterIndex = 0;
    }
  } else if (gameState === STATE.INITIALS) {
    // Navigate alphabet
    let moveL = keyPressed('ArrowLeft') || keyPressed('KeyA');
    let moveR = keyPressed('ArrowRight') || keyPressed('KeyD');

    // Touch: trigger on first press, then repeat every 12 frames while held
    if (touch.left) {
      if (!prevKeys._touchLeft) { moveL = true; prevKeys._touchRepeatL = 0; }
      else { prevKeys._touchRepeatL++; if (prevKeys._touchRepeatL % 12 === 0) moveL = true; }
    } else { prevKeys._touchRepeatL = 0; }
    if (touch.right) {
      if (!prevKeys._touchRight) { moveR = true; prevKeys._touchRepeatR = 0; }
      else { prevKeys._touchRepeatR++; if (prevKeys._touchRepeatR % 12 === 0) moveR = true; }
    } else { prevKeys._touchRepeatR = 0; }

    if (moveL) selectedLetterIndex = (selectedLetterIndex - 1 + 26) % 26;
    if (moveR) selectedLetterIndex = (selectedLetterIndex + 1) % 26;

    if (keyPressed('Space') || keyPressed('Enter') || (touch.jump && !prevTouchJump)) {
      playerInitials += ALPHABET[selectedLetterIndex];
      initialsCursor++;
      if (initialsCursor >= 3) {
        saveLeaderboard(playerInitials, totalTime);
        loadLeaderboard(); // refresh the displayed leaderboard
        gameState = STATE.TITLE;
      }
    }
    prevKeys._touchLeft = touch.left;
    prevKeys._touchRight = touch.right;
  }
  for (const k in keys) prevKeys[k] = keys[k];
  prevTouchJump = touch.jump;
  document.getElementById('toolsDisplay').textContent = toolsDelivered;
  document.getElementById('bumpsDisplay').textContent = carryingTool ? sheepBumps : 0;
  document.getElementById('timeDisplay').textContent = Math.floor(gameTimer/60);
  document.getElementById('bestDisplay').textContent = bestTime !== null ? bestTime+'s' : '-';
}

function draw() {
  ctx.clearRect(0, 0, BASE_W, BASE_H);
  if (gameState === STATE.TITLE) { drawTitle(); }
  else if (gameState === STATE.PLAYING) {
    drawSky(); drawPlatforms(); drawShelf(); drawKitchenProgress();
    drawToolOnShelf(); sheep.forEach(drawSheep);
    drawMarty(); drawDJParticles(); drawConn(player); drawDropFlash(); drawPickupFlash();
  }
  else if (gameState === STATE.WIN) { drawWin(); }
  else if (gameState === STATE.INITIALS) { drawInitials(); }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
