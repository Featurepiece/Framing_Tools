<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0a0a0f;
            --control-bg: rgba(20, 20, 30, 0.85);
            --accent: #c9a87c;
            --accent-glow: rgba(201, 168, 124, 0.4);
            --text: #e8e4df;
            --text-dim: rgba(232, 228, 223, 0.5);
            --border: rgba(201, 168, 124, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--primary-bg);
            overflow: hidden;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            cursor: none;
        }

        body.show-cursor {
            cursor: default;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Controls overlay */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            background: var(--control-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .controls.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
        }

        .controls .divider {
            width: 1px;
            height: 28px;
            background: var(--border);
        }

        /* Buttons */
        .ctrl-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .ctrl-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .ctrl-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #1a1a2e;
            font-weight: 700;
        }

        .ctrl-btn.active:hover {
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* Mode selector */
        .mode-btns {
            display: flex;
            gap: 6px;
        }

        .mode-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            border-radius: 10px;
        }

        /* Source buttons */
        .source-btns {
            display: flex;
            gap: 6px;
        }

        /* File input */
        .file-input {
            display: none;
        }

        /* Now playing */
        .now-playing {
            font-size: 12px;
            color: var(--text-dim);
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Title overlay */
        .title-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            background: radial-gradient(ellipse at center, rgba(10, 10, 15, 0.7) 0%, var(--primary-bg) 70%);
            transition: opacity 0.8s ease;
        }

        .title-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-overlay h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 6vw, 64px);
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
            text-shadow: 0 0 40px var(--accent-glow);
        }

        .title-overlay p {
            font-size: 15px;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        .title-overlay .start-hint {
            margin-top: 48px;
            font-size: 13px;
            color: var(--text-dim);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Fullscreen button */
        .fs-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: opacity 0.5s ease;
        }

        .fs-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Keyboard hints */
        .key-hint {
            font-size: 9px;
            color: var(--text-dim);
            position: absolute;
            bottom: 2px;
            right: 4px;
            pointer-events: none;
        }

        /* Mobile adjustments */
        @media (max-width: 640px) {
            .controls {
                bottom: 16px;
                padding: 10px 14px;
                gap: 8px;
                border-radius: 14px;
                max-width: calc(100% - 24px);
                flex-wrap: wrap;
                justify-content: center;
            }

            .mode-btn {
                width: 32px;
                height: 32px;
                font-size: 13px;
            }

            .ctrl-btn {
                padding: 6px 10px;
                font-size: 12px;
            }

            .now-playing {
                max-width: 100px;
                font-size: 11px;
            }

            .divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Title screen -->
    <div class="title-overlay" id="titleOverlay">
        <h1>Visualizer</h1>
        <p>audio-reactive visuals</p>
        <div class="start-hint">select a source below to begin</div>
    </div>

    <!-- Fullscreen button -->
    <button class="ctrl-btn fs-btn" id="fsBtn" title="Fullscreen (F)">&#x26F6;</button>

    <!-- Controls -->
    <div class="controls" id="controls">
        <!-- Source selection -->
        <div class="source-btns">
            <button class="ctrl-btn" id="micBtn" title="Use microphone">&#x1F399; Mic</button>
            <button class="ctrl-btn" id="fileBtn" title="Upload audio file">&#x1F4C1; File</button>
        </div>
        <input type="file" class="file-input" id="fileInput" accept="audio/*">

        <div class="divider"></div>

        <!-- Mode selection -->
        <div class="mode-btns">
            <button class="ctrl-btn mode-btn active" data-mode="0" title="Geometric">&#x25C7;</button>
            <button class="ctrl-btn mode-btn" data-mode="1" title="Organic">&#x223F;</button>
            <button class="ctrl-btn mode-btn" data-mode="2" title="Cosmic">&#x2726;</button>
            <button class="ctrl-btn mode-btn" data-mode="3" title="Minimal">&#x25CB;</button>
        </div>

        <div class="divider"></div>

        <!-- Now playing -->
        <div class="now-playing" id="nowPlaying">No audio</div>
    </div>

    <script>
    (() => {
        // ==================== SETUP ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const controls = document.getElementById('controls');
        const titleOverlay = document.getElementById('titleOverlay');
        const nowPlaying = document.getElementById('nowPlaying');
        const micBtn = document.getElementById('micBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const fsBtn = document.getElementById('fsBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');

        let width, height, cx, cy;
        let audioCtx, analyser, freqData, timeData, source;
        let currentMode = 0;
        let isActive = false;
        let hideTimer = null;
        let animId = null;
        let time = 0;
        let micStream = null;
        let audioElement = null;

        // Beat detection state
        let prevBass = 0, prevMid = 0, prevTreble = 0;
        let beatFlash = 0;
        let beatCount = 0;
        let smoothBass = 0, smoothMid = 0, smoothTreble = 0, smoothEnergy = 0;
        let peakBass = 0;

        // Resize canvas
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // ==================== AUDIO ====================
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 4096;
            analyser.smoothingTimeConstant = 0.75;
            freqData = new Uint8Array(analyser.frequencyBinCount);
            timeData = new Uint8Array(analyser.fftSize);
        }

        function disconnectSource() {
            if (source) {
                try { source.disconnect(); } catch(e) {}
                source = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (audioElement) {
                audioElement.pause();
                audioElement = null;
            }
        }

        async function startMic() {
            initAudio();
            disconnectSource();
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyser);
                micBtn.classList.add('active');
                fileBtn.classList.remove('active');
                nowPlaying.textContent = 'Listening...';
                activate();
            } catch(e) {
                nowPlaying.textContent = 'Mic denied';
            }
        }

        function loadFile(file) {
            initAudio();
            disconnectSource();
            audioElement = new Audio();
            audioElement.crossOrigin = 'anonymous';
            audioElement.src = URL.createObjectURL(file);
            source = audioCtx.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            audioElement.play();
            fileBtn.classList.add('active');
            micBtn.classList.remove('active');
            const name = file.name.replace(/\.[^/.]+$/, '');
            nowPlaying.textContent = name;
            activate();
        }

        function activate() {
            if (!isActive) {
                isActive = true;
                titleOverlay.classList.add('hidden');
                if (!animId) animate();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ==================== HELPERS ====================
        function getBand(data, start, end) {
            let sum = 0;
            const s = Math.floor(start * data.length);
            const e = Math.floor(end * data.length);
            for (let i = s; i < e; i++) sum += data[i];
            return sum / (e - s) / 255;
        }

        function getEnergy() {
            let sum = 0;
            for (let i = 0; i < freqData.length; i++) sum += freqData[i];
            return sum / freqData.length / 255;
        }

        function lerp(a, b, t) { return a + (b - a) * t; }

        function hsl(h, s, l, a) {
            return `hsla(${((h % 360) + 360) % 360}, ${s}%, ${l}%, ${a || 1})`;
        }

        function noise(x, y) {
            const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function smoothNoise(x, y) {
            const ix = Math.floor(x), iy = Math.floor(y);
            const fx = x - ix, fy = y - iy;
            const sx = fx * fx * (3 - 2 * fx);
            const sy = fy * fy * (3 - 2 * fy);
            return lerp(
                lerp(noise(ix, iy), noise(ix + 1, iy), sx),
                lerp(noise(ix, iy + 1), noise(ix + 1, iy + 1), sx),
                sy
            );
        }

        // Beat detection
        function detectBeat(bass, mid, treble, energy) {
            const bassJump = bass - prevBass;
            const isBeat = bassJump > 0.15 && bass > 0.4;
            if (isBeat) {
                beatFlash = 1.0;
                beatCount++;
            }
            beatFlash *= 0.88;
            prevBass = bass;
            prevMid = mid;
            prevTreble = treble;
            smoothBass = lerp(smoothBass, bass, 0.15);
            smoothMid = lerp(smoothMid, mid, 0.12);
            smoothTreble = lerp(smoothTreble, treble, 0.1);
            smoothEnergy = lerp(smoothEnergy, energy, 0.08);
            peakBass = Math.max(peakBass * 0.995, bass);
            return isBeat;
        }

        // Shared particle system
        let particles = [];
        function spawnBurst(x, y, count, hueBase, speed, sizeBase) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = (0.5 + Math.random()) * speed;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 1,
                    decay: 0.003 + Math.random() * 0.012,
                    hue: hueBase + Math.random() * 60 - 30,
                    size: sizeBase * (0.5 + Math.random()),
                    trail: []
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                // Store trail
                if (p.trail.length < 8) p.trail.push({ x: p.x, y: p.y });
                else { p.trail.shift(); p.trail.push({ x: p.x, y: p.y }); }

                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.985;
                p.vy *= 0.985;
                p.life -= p.decay;

                if (p.life <= 0) { particles.splice(i, 1); continue; }

                // Draw trail
                if (p.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(p.trail[0].x, p.trail[0].y);
                    for (let t = 1; t < p.trail.length; t++) {
                        ctx.lineTo(p.trail[t].x, p.trail[t].y);
                    }
                    ctx.strokeStyle = hsl(p.hue, 100, 70, p.life * 0.3);
                    ctx.lineWidth = p.size * p.life * 0.5;
                    ctx.stroke();
                }

                // Draw particle with glow
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = hsl(p.hue, 100, 75, p.life * 0.9);
                ctx.fill();

                // Glow
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life * 3, 0, Math.PI * 2);
                ctx.fillStyle = hsl(p.hue, 100, 60, p.life * 0.15);
                ctx.fill();
            }
            if (particles.length > 800) particles.splice(0, 200);
        }

        // ==================== VISUALIZERS ====================

        // Mode 0: KALEIDOSCOPE EXPLOSION
        let geoTrails = [];
        function drawGeometric() {
            const bass = getBand(freqData, 0, 0.08);
            const mid = getBand(freqData, 0.08, 0.35);
            const treble = getBand(freqData, 0.35, 1.0);
            const energy = getEnergy();
            const isBeat = detectBeat(bass, mid, treble, energy);

            // Fade with color tint
            ctx.fillStyle = `rgba(2, 2, 8, ${0.08 + beatFlash * 0.05})`;
            ctx.fillRect(0, 0, width, height);

            // Beat flash overlay
            if (beatFlash > 0.3) {
                const flashGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height) * 0.7);
                const flashHue = beatCount * 60;
                flashGrad.addColorStop(0, hsl(flashHue, 100, 80, beatFlash * 0.15));
                flashGrad.addColorStop(0.5, hsl(flashHue + 40, 100, 50, beatFlash * 0.05));
                flashGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = flashGrad;
                ctx.fillRect(0, 0, width, height);
            }

            const segments = 8;
            const segAngle = Math.PI * 2 / segments;

            ctx.save();
            ctx.translate(cx, cy);

            // Kaleidoscope mirrored segments
            for (let seg = 0; seg < segments; seg++) {
                ctx.save();
                ctx.rotate(seg * segAngle + time * 0.1 * (1 + smoothBass * 0.5));
                if (seg % 2) ctx.scale(1, -1);

                // Radial frequency bars — thick and bright
                const barCount = 32;
                for (let i = 0; i < barCount; i++) {
                    const freqIdx = Math.floor((i / barCount) * freqData.length * 0.4);
                    const val = freqData[freqIdx] / 255;
                    const barAngle = (i / barCount) * segAngle;
                    const innerR = 30 + smoothBass * 40;
                    const outerR = innerR + val * Math.min(width, height) * 0.35;

                    ctx.beginPath();
                    ctx.moveTo(Math.cos(barAngle) * innerR, Math.sin(barAngle) * innerR);
                    ctx.lineTo(Math.cos(barAngle) * outerR, Math.sin(barAngle) * outerR);

                    const hue1 = i * 11 + time * 40 + beatCount * 20;
                    ctx.strokeStyle = hsl(hue1, 100, 55 + val * 35, 0.4 + val * 0.6);
                    ctx.lineWidth = 2 + val * 5 + beatFlash * 3;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // Glow on tips
                    if (val > 0.5) {
                        ctx.beginPath();
                        ctx.arc(Math.cos(barAngle) * outerR, Math.sin(barAngle) * outerR, 3 + val * 6, 0, Math.PI * 2);
                        ctx.fillStyle = hsl(hue1, 100, 80, val * 0.6);
                        ctx.fill();
                    }
                }

                // Spiraling polygons
                for (let ring = 0; ring < 4; ring++) {
                    const sides = 3 + ring;
                    const baseR = 60 + ring * 65 + smoothBass * 50;
                    const rot = time * (0.5 + ring * 0.2) * (ring % 2 ? 1 : -1);

                    ctx.beginPath();
                    for (let i = 0; i <= sides; i++) {
                        const a = (i / sides) * segAngle + rot;
                        const wobble = Math.sin(time * 3 + i * 2) * treble * 25;
                        const r = baseR + wobble + mid * 40;
                        const px = Math.cos(a) * r;
                        const py = Math.sin(a) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    const ringHue = 180 + ring * 50 + time * 25;
                    ctx.strokeStyle = hsl(ringHue, 90, 60, 0.3 + energy * 0.5);
                    ctx.lineWidth = 2 + smoothBass * 4 + beatFlash * 4;
                    ctx.shadowColor = hsl(ringHue, 100, 60, 0.8);
                    ctx.shadowBlur = 10 + beatFlash * 20;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }

            ctx.restore();

            // Center core — pulsing orb
            const coreR = 20 + smoothBass * 50 + beatFlash * 40;
            for (let layer = 3; layer >= 0; layer--) {
                const r = coreR * (1 + layer * 0.5);
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                const coreHue = time * 30 + beatCount * 30;
                grad.addColorStop(0, hsl(coreHue, 100, 90, 0.5 / (layer + 1)));
                grad.addColorStop(0.5, hsl(coreHue + 60, 100, 60, 0.2 / (layer + 1)));
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
            }

            // Beat particles
            if (isBeat) {
                spawnBurst(cx, cy, 20 + Math.floor(bass * 30), beatCount * 60, 3 + bass * 8, 2 + bass * 4);
            }
            updateParticles();
        }

        // Mode 1: NEON LIQUID FIRE
        let fireParticles = [];
        function drawOrganic() {
            const bass = getBand(freqData, 0, 0.08);
            const mid = getBand(freqData, 0.08, 0.35);
            const treble = getBand(freqData, 0.35, 1.0);
            const energy = getEnergy();
            const isBeat = detectBeat(bass, mid, treble, energy);

            // Very slow fade for trails
            ctx.fillStyle = `rgba(3, 0, 8, 0.04)`;
            ctx.fillRect(0, 0, width, height);

            // Multiple flowing wave layers with neon colors
            const numLayers = 8;
            for (let layer = 0; layer < numLayers; layer++) {
                const layerPhase = layer * 0.7;
                const layerHue = 280 + layer * 35 + time * 15 + beatCount * 10;
                const amp = 40 + smoothBass * 80 + layer * 10;

                ctx.beginPath();
                const baseY = height * (0.15 + layer * 0.1);

                for (let x = -10; x <= width + 10; x += 3) {
                    const nx = x / width;
                    const freqIdx = Math.floor(nx * freqData.length * 0.5);
                    const val = freqData[freqIdx] / 255;

                    const wave1 = Math.sin(x * 0.006 + time * (0.8 + layer * 0.15) + layerPhase) * amp;
                    const wave2 = Math.sin(x * 0.015 + time * 1.5 + layer) * amp * 0.4 * mid;
                    const wave3 = Math.cos(x * 0.003 + time * 0.4) * amp * 0.6 * bass;
                    const freqWave = val * 80 * (1 + beatFlash);
                    const y = baseY + wave1 + wave2 + wave3 + freqWave;

                    if (x === -10) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.strokeStyle = hsl(layerHue, 100, 55 + treble * 30, 0.15 + energy * 0.35 + beatFlash * 0.2);
                ctx.lineWidth = 2 + smoothBass * 5 + beatFlash * 3;
                ctx.shadowColor = hsl(layerHue, 100, 60);
                ctx.shadowBlur = 15 + beatFlash * 25;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Glow underneath
                ctx.lineTo(width + 10, height);
                ctx.lineTo(-10, height);
                ctx.closePath();
                ctx.fillStyle = hsl(layerHue, 100, 50, 0.02 + energy * 0.03);
                ctx.fill();
            }

            // Rising fire particles
            if (energy > 0.2 || isBeat) {
                const count = isBeat ? 15 : 2;
                for (let i = 0; i < count; i++) {
                    fireParticles.push({
                        x: Math.random() * width,
                        y: height + 10,
                        vx: (Math.random() - 0.5) * 3,
                        vy: -(2 + Math.random() * 4 + bass * 6),
                        life: 1,
                        decay: 0.005 + Math.random() * 0.01,
                        hue: 280 + Math.random() * 80 + beatCount * 15,
                        size: 3 + Math.random() * 5 + bass * 4
                    });
                }
            }

            // Update fire particles
            for (let i = fireParticles.length - 1; i >= 0; i--) {
                const p = fireParticles[i];
                p.x += p.vx + Math.sin(time * 3 + p.x * 0.01) * 1.5;
                p.y += p.vy;
                p.vy *= 0.99;
                p.vx += (Math.random() - 0.5) * 0.3;
                p.life -= p.decay;
                p.hue += 1;

                if (p.life <= 0) { fireParticles.splice(i, 1); continue; }

                const r = p.size * p.life;
                // Outer glow
                ctx.beginPath();
                ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
                ctx.fillStyle = hsl(p.hue, 100, 50, p.life * 0.08);
                ctx.fill();
                // Core
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fillStyle = hsl(p.hue, 100, 75, p.life * 0.8);
                ctx.fill();
                // Hot center
                ctx.beginPath();
                ctx.arc(p.x, p.y, r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = hsl(p.hue + 40, 80, 95, p.life);
                ctx.fill();
            }
            if (fireParticles.length > 400) fireParticles.splice(0, 100);

            // Pulsing center aurora
            for (let a = 0; a < 3; a++) {
                const auraR = 150 + smoothBass * 200 + a * 80;
                const ax = cx + Math.sin(time * 0.5 + a * 2) * 100;
                const ay = cy + Math.cos(time * 0.3 + a) * 60;
                const grad = ctx.createRadialGradient(ax, ay, 0, ax, ay, auraR);
                const aHue = 300 + a * 40 + time * 10;
                grad.addColorStop(0, hsl(aHue, 100, 60, 0.06 + smoothEnergy * 0.08));
                grad.addColorStop(0.5, hsl(aHue + 30, 80, 40, 0.02));
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
            }
        }

        // Mode 2: HYPERDRIVE / WARP FIELD
        let warpStars = [];
        let warpTrails = [];
        function initWarpStars() {
            warpStars = [];
            for (let i = 0; i < 600; i++) {
                warpStars.push({
                    x: (Math.random() - 0.5) * width * 3,
                    y: (Math.random() - 0.5) * height * 3,
                    z: Math.random() * 1500 + 100,
                    hue: 180 + Math.random() * 120,
                    brightness: 0.5 + Math.random() * 0.5
                });
            }
        }
        initWarpStars();

        function drawCosmic() {
            const bass = getBand(freqData, 0, 0.08);
            const mid = getBand(freqData, 0.08, 0.35);
            const treble = getBand(freqData, 0.35, 1.0);
            const energy = getEnergy();
            const isBeat = detectBeat(bass, mid, treble, energy);

            // Background — very slight fade for streaking effect
            ctx.fillStyle = `rgba(0, 0, 4, ${0.06 + smoothBass * 0.04})`;
            ctx.fillRect(0, 0, width, height);

            // Warp speed based on energy
            const warpSpeed = 5 + smoothBass * 35 + beatFlash * 50;

            // Nebula clouds in background
            for (let n = 0; n < 4; n++) {
                const nx = cx + Math.sin(time * 0.15 + n * 1.5) * width * 0.3;
                const ny = cy + Math.cos(time * 0.1 + n * 2) * height * 0.3;
                const nr = 200 + smoothBass * 150;
                const nGrad = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
                const nHue = [280, 200, 340, 160][n] + time * 3;
                nGrad.addColorStop(0, hsl(nHue, 80, 40, 0.03 + smoothEnergy * 0.04));
                nGrad.addColorStop(0.6, hsl(nHue + 30, 60, 30, 0.01));
                nGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = nGrad;
                ctx.fillRect(0, 0, width, height);
            }

            // Stars flying toward viewer (warp effect)
            for (const s of warpStars) {
                s.z -= warpSpeed;
                if (s.z < 1) {
                    s.z = 1500;
                    s.x = (Math.random() - 0.5) * width * 3;
                    s.y = (Math.random() - 0.5) * height * 3;
                    s.hue = 180 + Math.random() * 120;
                }

                const perspective = 600 / s.z;
                const sx = cx + s.x * perspective;
                const sy = cy + s.y * perspective;

                if (sx < -50 || sx > width + 50 || sy < -50 || sy > height + 50) continue;

                // Previous position for streak
                const oldZ = s.z + warpSpeed;
                const oldPersp = 600 / oldZ;
                const osx = cx + s.x * oldPersp;
                const osy = cy + s.y * oldPersp;

                const size = Math.max(0.5, (1500 - s.z) / 1500 * 3 * (1 + smoothBass));
                const alpha = s.brightness * Math.min(1, (1500 - s.z) / 500) * (0.5 + energy * 0.5);

                // Star streak
                ctx.beginPath();
                ctx.moveTo(osx, osy);
                ctx.lineTo(sx, sy);
                const streakHue = s.hue + (1500 - s.z) * 0.05;
                ctx.strokeStyle = hsl(streakHue, 80, 75, alpha * 0.7);
                ctx.lineWidth = size * 0.8;
                ctx.stroke();

                // Star dot with glow
                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fillStyle = hsl(streakHue, 60, 90, alpha);
                ctx.fill();

                if (size > 1.5) {
                    ctx.beginPath();
                    ctx.arc(sx, sy, size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = hsl(streakHue, 100, 70, alpha * 0.15);
                    ctx.fill();
                }
            }

            // Central warp tunnel rings
            const ringCount = 12;
            for (let r = 0; r < ringCount; r++) {
                const ringZ = ((time * warpSpeed * 0.3 + r * 130) % 1500);
                const perspective = 600 / (ringZ + 50);
                const ringR = Math.max(width, height) * perspective * 0.8;
                const alpha = (1 - ringZ / 1500) * (0.1 + smoothEnergy * 0.15);

                if (ringR < 5 || ringR > Math.max(width, height)) continue;

                ctx.beginPath();
                ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
                const ringHue = 200 + r * 15 + time * 20;
                ctx.strokeStyle = hsl(ringHue, 80, 60, alpha);
                ctx.lineWidth = 1 + (1 - ringZ / 1500) * 3 + beatFlash * 2;
                ctx.stroke();
            }

            // Beat explosion — massive particle burst
            if (isBeat) {
                spawnBurst(cx, cy, 30 + Math.floor(bass * 40), 180 + beatCount * 45, 5 + bass * 12, 3 + bass * 5);
            }

            // Ambient particles
            if (Math.random() < energy * 0.3) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * 100;
                spawnBurst(
                    cx + Math.cos(angle) * dist,
                    cy + Math.sin(angle) * dist,
                    1, 200 + Math.random() * 100, 1 + energy * 3, 1.5
                );
            }

            updateParticles();

            // Central core glow
            const coreR = 15 + smoothBass * 30 + beatFlash * 50;
            for (let g = 0; g < 3; g++) {
                const gr = coreR * (1 + g * 1.5);
                const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
                coreGrad.addColorStop(0, hsl(200 + time * 10, 100, 95, 0.3 / (g + 1) + beatFlash * 0.2));
                coreGrad.addColorStop(0.4, hsl(240 + time * 10, 100, 70, 0.1 / (g + 1)));
                coreGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = coreGrad;
                ctx.fillRect(cx - gr, cy - gr, gr * 2, gr * 2);
            }
        }

        // Mode 3: SPECTRUM CATHEDRAL
        function drawMinimal() {
            const bass = getBand(freqData, 0, 0.08);
            const mid = getBand(freqData, 0.08, 0.35);
            const treble = getBand(freqData, 0.35, 1.0);
            const energy = getEnergy();
            const isBeat = detectBeat(bass, mid, treble, energy);

            // Slow elegant fade
            ctx.fillStyle = `rgba(4, 2, 10, 0.06)`;
            ctx.fillRect(0, 0, width, height);

            const maxR = Math.min(width, height) * 0.42;

            // Breathing background halo
            const haloR = maxR * (1.2 + smoothBass * 0.5);
            const haloGrad = ctx.createRadialGradient(cx, cy, maxR * 0.2, cx, cy, haloR);
            const bgHue = 260 + Math.sin(time * 0.15) * 40;
            haloGrad.addColorStop(0, hsl(bgHue, 60, 25, 0.03 + smoothEnergy * 0.04));
            haloGrad.addColorStop(0.5, hsl(bgHue + 30, 40, 15, 0.02));
            haloGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = haloGrad;
            ctx.fillRect(0, 0, width, height);

            // Mirrored circular frequency bars (spectrum ring)
            const barCount = 128;
            for (let i = 0; i < barCount; i++) {
                const angle = (i / barCount) * Math.PI * 2 - Math.PI / 2 + time * 0.05;
                const freqIdx = Math.floor((i / barCount) * freqData.length * 0.6);
                const val = freqData[freqIdx] / 255;

                const innerR = maxR * 0.35 + smoothBass * 20;
                const outerR = innerR + val * maxR * 0.55 + beatFlash * 30;

                const x1 = cx + Math.cos(angle) * innerR;
                const y1 = cy + Math.sin(angle) * innerR;
                const x2 = cx + Math.cos(angle) * outerR;
                const y2 = cy + Math.sin(angle) * outerR;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);

                const barHue = (i / barCount) * 270 + 200 + time * 8;
                ctx.strokeStyle = hsl(barHue, 90, 55 + val * 35, 0.3 + val * 0.7);
                ctx.lineWidth = 2.5 + val * 3;
                ctx.lineCap = 'round';

                if (val > 0.6) {
                    ctx.shadowColor = hsl(barHue, 100, 60);
                    ctx.shadowBlur = 8 + val * 12;
                }
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Mirror inward
                const mirrorR = innerR - val * maxR * 0.15;
                const mx = cx + Math.cos(angle) * mirrorR;
                const my = cy + Math.sin(angle) * mirrorR;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(mx, my);
                ctx.strokeStyle = hsl(barHue + 60, 70, 55, 0.15 + val * 0.3);
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // Circular waveform — thicker, glowing
            ctx.beginPath();
            const waveR = maxR * 0.35 + smoothBass * 20;
            const step = 4;
            for (let i = 0; i < timeData.length; i += step) {
                const angle = (i / timeData.length) * Math.PI * 2 - Math.PI / 2;
                const val = (timeData[i] - 128) / 128;
                const r = waveR + val * 40 * (1 + smoothBass);
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            const waveHue = 30 + time * 5;
            ctx.strokeStyle = hsl(waveHue, 70, 75, 0.4 + smoothEnergy * 0.4);
            ctx.lineWidth = 2 + smoothBass * 2;
            ctx.shadowColor = hsl(waveHue, 100, 70);
            ctx.shadowBlur = 12 + beatFlash * 20;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Expanding pulse rings on beat
            if (isBeat) {
                warpTrails.push({
                    r: waveR,
                    maxR: maxR * 1.5,
                    life: 1,
                    hue: 200 + beatCount * 30
                });
            }
            for (let i = warpTrails.length - 1; i >= 0; i--) {
                const ring = warpTrails[i];
                ring.r += (ring.maxR - ring.r) * 0.04;
                ring.life -= 0.015;
                if (ring.life <= 0) { warpTrails.splice(i, 1); continue; }

                ctx.beginPath();
                ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
                ctx.strokeStyle = hsl(ring.hue, 80, 65, ring.life * 0.4);
                ctx.lineWidth = 2 * ring.life;
                ctx.stroke();
            }

            // Orbiting frequency dots — larger, brighter
            const orbitCount = 48;
            for (let i = 0; i < orbitCount; i++) {
                const angle = (i / orbitCount) * Math.PI * 2 + time * 0.4;
                const freqIdx = Math.floor((i / orbitCount) * freqData.length * 0.5);
                const val = freqData[freqIdx] / 255;

                // Two orbits
                for (let orbit = 0; orbit < 2; orbit++) {
                    const orbitR = waveR * (0.7 + orbit * 0.8) + val * 50;
                    const orbitAngle = angle + orbit * Math.PI + time * 0.1 * (orbit ? -1 : 1);
                    const dx = cx + Math.cos(orbitAngle) * orbitR;
                    const dy = cy + Math.sin(orbitAngle) * orbitR;
                    const dotSize = 2 + val * 6;

                    ctx.beginPath();
                    ctx.arc(dx, dy, dotSize, 0, Math.PI * 2);
                    const dotHue = (i / orbitCount) * 360 + time * 10;
                    ctx.fillStyle = hsl(dotHue, 90, 70, 0.3 + val * 0.7);
                    ctx.fill();

                    if (val > 0.4) {
                        ctx.beginPath();
                        ctx.arc(dx, dy, dotSize * 3, 0, Math.PI * 2);
                        ctx.fillStyle = hsl(dotHue, 100, 60, val * 0.1);
                        ctx.fill();
                    }
                }
            }

            // Center jewel
            const jewelR = 12 + smoothBass * 20 + beatFlash * 15;
            const jewelGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, jewelR * 2);
            const jHue = 30 + time * 8;
            jewelGrad.addColorStop(0, hsl(jHue, 60, 95, 0.8));
            jewelGrad.addColorStop(0.3, hsl(jHue, 80, 70, 0.4));
            jewelGrad.addColorStop(0.7, hsl(jHue + 30, 70, 50, 0.1));
            jewelGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = jewelGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, jewelR * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // ==================== ANIMATION LOOP ====================
        const drawFns = [drawGeometric, drawOrganic, drawCosmic, drawMinimal];

        function animate() {
            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);
            time += 0.016;
            drawFns[currentMode]();
            animId = requestAnimationFrame(animate);
        }

        // ==================== UI EVENTS ====================
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentMode = parseInt(btn.dataset.mode);
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                ctx.fillStyle = 'rgba(0, 0, 4, 1)';
                ctx.fillRect(0, 0, width, height);
                particles = [];
                fireParticles = [];
                warpTrails = [];
            });
        });

        micBtn.addEventListener('click', startMic);

        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) loadFile(e.target.files[0]);
        });

        fsBtn.addEventListener('click', toggleFullscreen);
        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '4') {
                const mode = parseInt(e.key) - 1;
                currentMode = mode;
                modeBtns.forEach(b => b.classList.remove('active'));
                modeBtns[mode].classList.add('active');
                ctx.fillStyle = 'rgba(0, 0, 4, 1)';
                ctx.fillRect(0, 0, width, height);
                particles = [];
                fireParticles = [];
                warpTrails = [];
            }
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
            if (e.key === ' ') {
                e.preventDefault();
                if (audioElement) {
                    if (audioElement.paused) audioElement.play();
                    else audioElement.pause();
                }
            }
        });

        function showControls() {
            controls.classList.remove('hidden');
            fsBtn.classList.remove('hidden');
            document.body.classList.add('show-cursor');
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                if (isActive) {
                    controls.classList.add('hidden');
                    fsBtn.classList.add('hidden');
                    document.body.classList.remove('show-cursor');
                }
            }, 3000);
        }

        document.addEventListener('mousemove', showControls);
        document.addEventListener('touchstart', showControls);

        window.addEventListener('resize', () => { initWarpStars(); });

        // Idle animation
        function idleAnimate() {
            if (isActive) return;
            time += 0.016;
            ctx.fillStyle = `rgba(4, 2, 10, 0.03)`;
            ctx.fillRect(0, 0, width, height);

            // Floating aurora idle
            for (let i = 0; i < 30; i++) {
                const angle = time * 0.2 + i * 0.5;
                const dist = 80 + i * 12 + Math.sin(time * 0.5 + i) * 30;
                const x = cx + Math.cos(angle) * dist;
                const y = cy + Math.sin(angle * 0.7) * dist * 0.6;
                const alpha = 0.02 + 0.03 * Math.sin(time * 0.8 + i * 0.4);
                const size = 2 + Math.sin(time + i) * 1.5;

                ctx.beginPath();
                ctx.arc(x, y, Math.abs(size), 0, Math.PI * 2);
                ctx.fillStyle = hsl(280 + i * 8 + time * 5, 80, 65, alpha);
                ctx.fill();

                // Glow
                ctx.beginPath();
                ctx.arc(x, y, Math.abs(size) * 4, 0, Math.PI * 2);
                ctx.fillStyle = hsl(280 + i * 8 + time * 5, 80, 50, alpha * 0.3);
                ctx.fill();
            }

            requestAnimationFrame(idleAnimate);
        }
        idleAnimate();
    })();
    </script>
</body>
