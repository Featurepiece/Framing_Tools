<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Resize Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f6f3;
            --bg-secondary: #ffffff;
            --bg-accent: #2c3e50;
            --text-primary: #2c3e50;
            --text-secondary: #6b7c8a;
            --text-light: #ffffff;
            --accent: #c9a87c;
            --accent-hover: #b8956a;
            --border: #e8e4df;
            --shadow: rgba(44, 62, 80, 0.08);
            --danger: #c0392b;
            --success: #27ae60;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.2s;
            z-index: 100;
        }

        .menu-btn:hover {
            background: var(--accent);
            color: var(--text-light);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 30px 20px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 24px; }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .subtitle { color: var(--text-secondary); font-size: 0.95rem; }

        .controls-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .unit-toggle, .mode-toggle {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .unit-toggle button, .mode-toggle button {
            padding: 8px 16px;
            border: none;
            background: var(--bg-secondary);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .unit-toggle button.active, .mode-toggle button.active {
            background: var(--accent);
            color: var(--text-light);
        }

        .unit-toggle button:hover:not(.active), .mode-toggle button:hover:not(.active) {
            background: var(--border);
        }

        /* Two-column layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px var(--shadow);
        }

        .panel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-field { flex: 1; min-width: 80px; }

        .input-field label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .input-field input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-field .unit-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .upload-section {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--accent);
            color: var(--text-light);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .upload-btn:hover { background: var(--accent-hover); }

        .clear-btn {
            padding: 8px 12px;
            background: rgba(192, 57, 43, 0.1);
            color: var(--danger);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .clear-btn:hover { background: rgba(192, 57, 43, 0.2); }

        .image-info {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .image-thumbnail {
            max-width: 80px;
            max-height: 100px;
            object-fit: contain;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .image-details { flex: 1; font-size: 0.8rem; }
        .image-details .row { display: flex; justify-content: space-between; padding: 2px 0; }
        .image-details .label { color: var(--text-secondary); }
        .image-details .value { font-weight: 500; }

        .dpi-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .dpi-row label { font-size: 0.8rem; color: var(--text-secondary); }

        .dpi-row input {
            width: 60px;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            text-align: center;
        }

        .dpi-row input:focus { outline: none; border-color: var(--accent); }

        .dpi-presets { display: flex; gap: 4px; }

        .dpi-presets button {
            padding: 4px 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dpi-presets button:hover { background: var(--bg-primary); }
        .dpi-presets button.active { background: var(--accent); color: var(--text-light); border-color: var(--accent); }

        .multiplier-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .multiplier-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .multiplier-presets {
            display: flex;
            gap: 4px;
        }

        .multiplier-presets button {
            padding: 5px 12px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }

        .multiplier-presets button:hover { background: var(--bg-primary); }

        .aspect-ratio-display {
            background: rgba(201, 168, 124, 0.15);
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--accent-hover);
            font-weight: 500;
            text-align: center;
        }

        .results {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 14px;
            margin-top: 14px;
            border-left: 4px solid var(--accent);
        }

        .results h3 {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .result-row:last-child { border-bottom: none; }
        .result-row .label { color: var(--text-secondary); }
        .result-row .value { font-weight: 600; color: var(--accent); }

        .preview-container {
            display: flex;
            justify-content: center;
            margin-top: 14px;
        }

        .preview-canvas {
            border: 1px solid var(--border);
            background: var(--bg-primary);
            border-radius: 8px;
            max-width: 100%;
        }

        .crop-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .crop-option {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .crop-option:hover { border-color: var(--accent); }
        .crop-option.selected { border-color: var(--accent); background: rgba(201, 168, 124, 0.1); }

        .crop-option h4 {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .crop-option .details { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4; }
        .crop-option .crop-amount { margin-top: 6px; font-weight: 600; color: var(--danger); font-size: 0.85rem; }

        .no-crop-message {
            background: rgba(39, 174, 96, 0.1);
            border-radius: 6px;
            padding: 14px;
            text-align: center;
            color: var(--success);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .fit-previews {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .preview-box { text-align: center; }
        .preview-box h4 { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px; }

        .preview-canvas.interactive { cursor: move; }

        .reset-btn {
            margin-top: 6px;
            padding: 4px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .reset-btn:hover { background: var(--border); }

        .drag-hint { font-size: 0.7rem; color: var(--text-secondary); font-weight: normal; }

        .quality-indicator {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 14px;
            margin-top: 14px;
        }

        .quality-indicator h3 {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .quality-bar-container {
            position: relative;
            height: 24px;
            background: linear-gradient(to right, #c0392b 0%, #e67e22 25%, #f1c40f 45%, #27ae60 70%, #27ae60 100%);
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: visible;
        }

        .quality-bar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-secondary);
            padding: 0 2px;
            margin-bottom: 6px;
        }

        .quality-needle {
            position: absolute;
            top: -4px;
            width: 4px;
            height: 32px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: left 0.3s ease;
        }

        .quality-needle::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: -4px;
            width: 12px;
            height: 12px;
            background: var(--text-primary);
            border-radius: 50%;
        }

        .quality-details {
            margin-top: 12px;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .quality-dpi-value {
            font-size: 1.3rem;
            font-weight: 600;
            margin-right: 6px;
        }

        .quality-rating {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
            margin-left: 4px;
        }

        .quality-description {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .quality-megapixels {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .rotate-btn {
            padding: 6px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .rotate-btn:hover { background: var(--border); }

        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            h1 { font-size: 1.75rem; }
            .input-group { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="menu-btn">← Menu</a>
    <div class="container">
        <header>
            <h1>Photo Resize Calculator</h1>
            <p class="subtitle">Calculate dimensions and cropping for your prints</p>
        </header>

        <div class="controls-row">
            <div class="unit-toggle">
                <button id="btn-mm" class="active" onclick="setUnit('mm')">mm</button>
                <button id="btn-inch" onclick="setUnit('inch')">inches</button>
            </div>
            <div class="mode-toggle">
                <button id="btn-proportional" class="active" onclick="setMode('proportional')">Proportional</button>
                <button id="btn-fit" onclick="setMode('fit')">Fit to Target</button>
            </div>
        </div>

        <div class="main-layout">
            <!-- LEFT COLUMN: Original Image -->
            <div class="panel">
                <h2>Original Image</h2>
                
                <div class="upload-section">
                    <label for="image-upload" class="upload-btn">
                        <span id="upload-btn-text">📷 Upload</span>
                        <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)" style="display: none;">
                    </label>
                    <button id="clear-image-btn" class="clear-btn" onclick="clearImage()" style="display: none;">✕ Clear</button>
                </div>
                
                <div id="image-info" class="image-info" style="display: none;">
                    <img id="image-thumbnail" class="image-thumbnail" alt="Uploaded image">
                    <div class="image-details">
                        <div class="row"><span class="label">Pixels:</span><span class="value" id="pixel-dimensions">—</span></div>
                        <div class="row"><span class="label">DPI:</span><span class="value" id="embedded-dpi">—</span></div>
                        <div class="row"><span class="label">Print size:</span><span class="value" id="native-print-size">—</span></div>
                        <div class="dpi-row">
                            <label>Working DPI:</label>
                            <input type="number" id="working-dpi" value="300" min="1" oninput="updatePhysicalSize()">
                            <div class="dpi-presets">
                                <button onclick="setDPI(150)">150</button>
                                <button onclick="setDPI(300)" class="active">300</button>
                                <button onclick="setDPI(350)">350</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-field">
                        <label for="orig-width">Width</label>
                        <input type="number" id="orig-width" value="" min="0" step="any" oninput="calculate()">
                        <div class="unit-label">mm</div>
                    </div>
                    <div class="input-field">
                        <label for="orig-height">Height</label>
                        <input type="number" id="orig-height" value="" min="0" step="any" oninput="calculate()">
                        <div class="unit-label">mm</div>
                    </div>
                </div>
                
                <div class="aspect-ratio-display" id="aspect-ratio-display">Aspect Ratio: —</div>
            </div>

            <!-- RIGHT COLUMN: Results -->
            <div>
                <!-- Proportional Mode -->
                <div class="panel" id="proportional-panel">
                    <h2>New Size</h2>
                    <div class="input-group">
                        <div class="input-field">
                            <label for="new-width">New Width</label>
                            <input type="number" id="new-width" value="" min="0" step="any" oninput="calculateFromWidth()">
                            <div class="unit-label">mm</div>
                        </div>
                        <div class="input-field">
                            <label for="new-height">New Height</label>
                            <input type="number" id="new-height" min="0" step="any" oninput="calculateFromHeight()">
                            <div class="unit-label">mm</div>
                        </div>
                    </div>

                    <div class="multiplier-row">
                        <span class="multiplier-label">Scale:</span>
                        <div class="multiplier-presets">
                            <button onclick="applyMultiplier(0.5)">½×</button>
                            <button onclick="applyMultiplier(2)">2×</button>
                            <button onclick="applyMultiplier(3)">3×</button>
                            <button onclick="applyMultiplier(4)">4×</button>
                        </div>
                    </div>
                    
                    <div class="results" id="proportional-results">
                        <h3>Calculated</h3>
                        <div class="result-row">
                            <span class="label">New Size:</span>
                            <span class="value" id="calc-size">—</span>
                        </div>
                        <div class="result-row">
                            <span class="label">Scale Factor:</span>
                            <span class="value" id="calc-scale">—</span>
                        </div>
                    </div>

                    <div id="proportional-quality" class="quality-indicator" style="display: none;"></div>

                    <div class="preview-container">
                        <canvas id="proportional-preview" class="preview-canvas" width="280" height="180"></canvas>
                    </div>
                </div>

                <!-- Fit Mode -->
                <div class="panel" id="fit-panel" style="display: none;">
                    <h2>Target Size</h2>
                    <div class="input-group">
                        <div class="input-field">
                            <label for="target-width">Target Width</label>
                            <input type="number" id="target-width" value="500" min="0" step="any" oninput="calculate()">
                            <div class="unit-label">mm</div>
                        </div>
                        <div class="input-field">
                            <label for="target-height">Target Height</label>
                            <input type="number" id="target-height" value="400" min="0" step="any" oninput="calculate()">
                            <div class="unit-label">mm</div>
                        </div>
                    </div>

                    <div style="margin-bottom: 12px;">
                        <button class="rotate-btn" onclick="rotateTarget()">↻ Rotate Target</button>
                    </div>

                    <div id="crop-results"></div>

                    <div id="fit-quality" class="quality-indicator" style="display: none;"></div>

                    <div class="fit-previews" id="fit-preview-container">
                        <div class="preview-box">
                            <h4>Original <span class="drag-hint">(drag to adjust)</span></h4>
                            <canvas id="original-preview" class="preview-canvas" width="200" height="150"></canvas>
                            <button class="reset-btn" id="reset-position-btn" onclick="resetCropPosition()" style="display: none;">Reset</button>
                        </div>
                        <div class="preview-box">
                            <h4>Result</h4>
                            <canvas id="crop-preview" class="preview-canvas" width="160" height="120"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUnit = 'mm';
        let currentMode = 'proportional';
        let selectedCropOption = 'width';
        let lastEditedField = 'width';
        let uploadedImage = null;
        
        let imagePixelWidth = 0;
        let imagePixelHeight = 0;
        let embeddedDPI = null;
        
        let isDragging = false;
        let cropPositionX = 0.5;
        let cropPositionY = 0.5;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragStartPosX = 0;
        let dragStartPosY = 0;
        let currentCropOption = null;
        let canvasDrawInfo = null;

        const MM_PER_INCH = 25.4;

        function convertValue(value, fromUnit, toUnit) {
            if (fromUnit === toUnit || !value) return value;
            if (fromUnit === 'mm' && toUnit === 'inch') return value / MM_PER_INCH;
            if (fromUnit === 'inch' && toUnit === 'mm') return value * MM_PER_INCH;
            return value;
        }

        function readEXIFDPI(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const view = new DataView(e.target.result);
                    if (view.getUint16(0, false) !== 0xFFD8) { resolve(null); return; }
                    let offset = 2;
                    const length = view.byteLength;
                    while (offset < length) {
                        if (view.getUint8(offset) !== 0xFF) { resolve(null); return; }
                        const marker = view.getUint8(offset + 1);
                        if (marker === 0xE0) {
                            const densityUnits = view.getUint8(offset + 11);
                            const xDensity = view.getUint16(offset + 12, false);
                            const yDensity = view.getUint16(offset + 14, false);
                            if (densityUnits === 1 && xDensity > 1) { resolve({ x: xDensity, y: yDensity, source: 'JFIF' }); return; }
                            else if (densityUnits === 2 && xDensity > 1) { resolve({ x: Math.round(xDensity * 2.54), y: Math.round(yDensity * 2.54), source: 'JFIF' }); return; }
                        }
                        if (marker === 0xE1) {
                            const segmentLength = view.getUint16(offset + 2, false);
                            if (view.getUint32(offset + 4, false) === 0x45786966 && view.getUint16(offset + 8, false) === 0x0000) {
                                const tiffOffset = offset + 10;
                                const littleEndian = view.getUint16(tiffOffset, false) === 0x4949;
                                const ifdOffset = view.getUint32(tiffOffset + 4, littleEndian);
                                const numEntries = view.getUint16(tiffOffset + ifdOffset, littleEndian);
                                let xRes = null, yRes = null, resUnit = 2;
                                for (let i = 0; i < numEntries; i++) {
                                    const entryOffset = tiffOffset + ifdOffset + 2 + (i * 12);
                                    const tag = view.getUint16(entryOffset, littleEndian);
                                    if (tag === 0x011A) { const valueOffset = view.getUint32(entryOffset + 8, littleEndian); xRes = view.getUint32(tiffOffset + valueOffset, littleEndian) / view.getUint32(tiffOffset + valueOffset + 4, littleEndian); }
                                    if (tag === 0x011B) { const valueOffset = view.getUint32(entryOffset + 8, littleEndian); yRes = view.getUint32(tiffOffset + valueOffset, littleEndian) / view.getUint32(tiffOffset + valueOffset + 4, littleEndian); }
                                    if (tag === 0x0128) { resUnit = view.getUint16(entryOffset + 8, littleEndian); }
                                }
                                if (xRes && yRes && xRes > 1) {
                                    if (resUnit === 3) { resolve({ x: Math.round(xRes * 2.54), y: Math.round(yRes * 2.54), source: 'EXIF' }); }
                                    else if (resUnit === 2) { resolve({ x: Math.round(xRes), y: Math.round(yRes), source: 'EXIF' }); }
                                    return;
                                }
                            }
                            offset += 2 + segmentLength;
                            continue;
                        }
                        if (marker === 0xD9 || marker === 0xDA) break;
                        const segmentLength = view.getUint16(offset + 2, false);
                        offset += 2 + segmentLength;
                    }
                    resolve(null);
                };
                reader.readAsArrayBuffer(file.slice(0, 65536));
            });
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            readEXIFDPI(file).then(dpiInfo => {
                embeddedDPI = dpiInfo;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImage = img;
                        imagePixelWidth = img.width;
                        imagePixelHeight = img.height;
                        
                        document.getElementById('image-info').style.display = 'flex';
                        document.getElementById('image-thumbnail').src = e.target.result;
                        document.getElementById('pixel-dimensions').textContent = `${img.width} × ${img.height}`;
                        
                        if (embeddedDPI && embeddedDPI.x > 1) {
                            document.getElementById('embedded-dpi').textContent = `${embeddedDPI.x} (${embeddedDPI.source})`;
                            const nativeWidthMM = (img.width / embeddedDPI.x) * 25.4;
                            const nativeHeightMM = (img.height / embeddedDPI.y) * 25.4;
                            document.getElementById('native-print-size').textContent = `${Math.round(nativeWidthMM)} × ${Math.round(nativeHeightMM)} mm`;
                            document.getElementById('working-dpi').value = embeddedDPI.x;
                            updateDPIButtons(embeddedDPI.x);
                        } else {
                            document.getElementById('embedded-dpi').textContent = 'Not found';
                            document.getElementById('native-print-size').textContent = '—';
                            document.getElementById('working-dpi').value = 300;
                            updateDPIButtons(300);
                        }
                        
                        document.getElementById('upload-btn-text').textContent = '📷 Change';
                        document.getElementById('clear-image-btn').style.display = 'inline-block';
                        
                        // AUTO-POPULATE: Set original dimensions automatically
                        updatePhysicalSize();
                        autoPopulateOriginalDimensions();
                        calculate();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function autoPopulateOriginalDimensions() {
            if (imagePixelWidth === 0 || imagePixelHeight === 0) return;
            const dpi = parseFloat(document.getElementById('working-dpi').value) || 300;
            let physicalWidth, physicalHeight;
            if (currentUnit === 'mm') {
                physicalWidth = (imagePixelWidth / dpi) * 25.4;
                physicalHeight = (imagePixelHeight / dpi) * 25.4;
            } else {
                physicalWidth = imagePixelWidth / dpi;
                physicalHeight = imagePixelHeight / dpi;
            }
            document.getElementById('orig-width').value = formatNumber(physicalWidth);
            document.getElementById('orig-height').value = formatNumber(physicalHeight);
        }

        function updatePhysicalSize() {
            if (imagePixelWidth === 0 || imagePixelHeight === 0) return;
            const dpi = parseFloat(document.getElementById('working-dpi').value) || 300;
            let physicalWidth, physicalHeight;
            if (currentUnit === 'mm') {
                physicalWidth = (imagePixelWidth / dpi) * 25.4;
                physicalHeight = (imagePixelHeight / dpi) * 25.4;
            } else {
                physicalWidth = imagePixelWidth / dpi;
                physicalHeight = imagePixelHeight / dpi;
            }
            document.getElementById('native-print-size').textContent = `${formatNumber(physicalWidth)} × ${formatNumber(physicalHeight)} ${currentUnit === 'mm' ? 'mm' : '"'}`;
            // Also update the original dimensions when DPI changes
            autoPopulateOriginalDimensions();
            calculate();
        }

        function setDPI(dpi) {
            document.getElementById('working-dpi').value = dpi;
            updateDPIButtons(dpi);
            updatePhysicalSize();
        }

        function updateDPIButtons(activeDPI) {
            document.querySelectorAll('.dpi-presets button').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent) === activeDPI);
            });
        }

        function clearImage() {
            uploadedImage = null;
            imagePixelWidth = 0;
            imagePixelHeight = 0;
            embeddedDPI = null;
            document.getElementById('image-upload').value = '';
            document.getElementById('image-info').style.display = 'none';
            document.getElementById('upload-btn-text').textContent = '📷 Upload';
            document.getElementById('clear-image-btn').style.display = 'none';
            document.getElementById('orig-width').value = '';
            document.getElementById('orig-height').value = '';
            calculate();
        }

        function setUnit(unit) {
            if (unit === currentUnit) return;
            const oldUnit = currentUnit;
            currentUnit = unit;

            document.getElementById('btn-mm').classList.toggle('active', unit === 'mm');
            document.getElementById('btn-inch').classList.toggle('active', unit === 'inch');
            const unitLabel = unit === 'mm' ? 'mm' : 'inches';
            document.querySelectorAll('.unit-label').forEach(el => el.textContent = unitLabel);

            // Convert all dimension fields
            const fieldsToConvert = ['orig-width', 'orig-height', 'new-width', 'new-height', 'target-width', 'target-height'];
            fieldsToConvert.forEach(fieldId => {
                const input = document.getElementById(fieldId);
                const val = parseFloat(input.value);
                if (val && val > 0) {
                    input.value = formatNumberForUnit(convertValue(val, oldUnit, unit), unit);
                }
            });

            // Update the print size display
            if (imagePixelWidth > 0) {
                updatePhysicalSizeDisplay();
            }

            calculate();
        }

        function formatNumberForUnit(num, unit) {
            if (unit === 'inch') return num.toFixed(3);
            return num % 1 === 0 ? num.toString() : num.toFixed(2);
        }

        function updatePhysicalSizeDisplay() {
            if (imagePixelWidth === 0 || imagePixelHeight === 0) return;
            const dpi = parseFloat(document.getElementById('working-dpi').value) || 300;
            let physicalWidth, physicalHeight;
            if (currentUnit === 'mm') {
                physicalWidth = (imagePixelWidth / dpi) * 25.4;
                physicalHeight = (imagePixelHeight / dpi) * 25.4;
            } else {
                physicalWidth = imagePixelWidth / dpi;
                physicalHeight = imagePixelHeight / dpi;
            }
            document.getElementById('native-print-size').textContent = `${formatNumber(physicalWidth)} × ${formatNumber(physicalHeight)} ${currentUnit === 'mm' ? 'mm' : '"'}`;
        }

        function rotateTarget() {
            const widthInput = document.getElementById('target-width');
            const heightInput = document.getElementById('target-height');
            const w = widthInput.value;
            widthInput.value = heightInput.value;
            heightInput.value = w;
            cropPositionX = 0.5;
            cropPositionY = 0.5;
            calculate();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-proportional').classList.toggle('active', mode === 'proportional');
            document.getElementById('btn-fit').classList.toggle('active', mode === 'fit');
            document.getElementById('proportional-panel').style.display = mode === 'proportional' ? 'block' : 'none';
            document.getElementById('fit-panel').style.display = mode === 'fit' ? 'block' : 'none';
            calculate();
        }

        function getValues() {
            return {
                origWidth: parseFloat(document.getElementById('orig-width').value) || 0,
                origHeight: parseFloat(document.getElementById('orig-height').value) || 0,
                newWidth: parseFloat(document.getElementById('new-width').value) || 0,
                newHeight: parseFloat(document.getElementById('new-height').value) || 0,
                targetWidth: parseFloat(document.getElementById('target-width').value) || 0,
                targetHeight: parseFloat(document.getElementById('target-height').value) || 0
            };
        }

        function gcd(a, b) { a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b)); while (b) { let t = b; b = a % b; a = t; } return a; }

        function formatNumber(num) {
            if (currentUnit === 'inch') return num.toFixed(3);
            return num % 1 === 0 ? num.toString() : num.toFixed(2);
        }

        function calculateAspectRatio(width, height) {
            if (width <= 0 || height <= 0) return { ratio: '—', decimal: '—' };
            const divisor = gcd(width, height);
            const ratioW = Math.round(width / divisor);
            const ratioH = Math.round(height / divisor);
            const decimal = (width / height).toFixed(3);
            if (ratioW > 100 || ratioH > 100) return { ratio: decimal + ':1', decimal: decimal };
            return { ratio: `${ratioW}:${ratioH}`, decimal: decimal };
        }

        function calculateFromWidth() {
            lastEditedField = 'width';
            const v = getValues();
            if (v.origWidth > 0 && v.origHeight > 0 && v.newWidth > 0) {
                const ratio = v.origHeight / v.origWidth;
                document.getElementById('new-height').value = formatNumber(v.newWidth * ratio);
            }
            calculate();
        }

        function calculateFromHeight() {
            lastEditedField = 'height';
            const v = getValues();
            if (v.origWidth > 0 && v.origHeight > 0 && v.newHeight > 0) {
                const ratio = v.origWidth / v.origHeight;
                document.getElementById('new-width').value = formatNumber(v.newHeight * ratio);
            }
            calculate();
        }

        function applyMultiplier(multiplier) {
            const v = getValues();
            if (v.origWidth <= 0 || v.origHeight <= 0) return;
            document.getElementById('new-width').value = formatNumber(v.origWidth * multiplier);
            document.getElementById('new-height').value = formatNumber(v.origHeight * multiplier);
            calculate();
        }

        function calculate() {
            const v = getValues();
            const ar = calculateAspectRatio(v.origWidth, v.origHeight);
            document.getElementById('aspect-ratio-display').textContent = `Aspect Ratio: ${ar.ratio} (${ar.decimal}:1)`;
            if (currentMode === 'proportional') calculateProportional(v);
            else calculateFit(v);
        }

        function calculateProportional(v) {
            const newWidth = parseFloat(document.getElementById('new-width').value) || 0;
            const newHeight = parseFloat(document.getElementById('new-height').value) || 0;
            drawProportionalPreview(v, newWidth, newHeight);
            if (v.origWidth <= 0 || v.origHeight <= 0 || (newWidth <= 0 && newHeight <= 0)) {
                document.getElementById('calc-size').textContent = '—';
                document.getElementById('calc-scale').textContent = '—';
                updateQualityIndicator('proportional-quality', 0, 0);
                return;
            }
            const unitLabel = currentUnit === 'mm' ? 'mm' : '"';
            const scale = newWidth > 0 ? (newWidth / v.origWidth * 100) : (newHeight / v.origHeight * 100);
            document.getElementById('calc-size').textContent = `${formatNumber(newWidth || (newHeight * v.origWidth / v.origHeight))} × ${formatNumber(newHeight || (newWidth * v.origHeight / v.origWidth))} ${unitLabel}`;
            document.getElementById('calc-scale').textContent = `${scale.toFixed(1)}%`;

            const finalW = newWidth || (newHeight * v.origWidth / v.origHeight);
            const finalH = newHeight || (newWidth * v.origHeight / v.origWidth);
            updateQualityIndicator('proportional-quality', finalW, finalH);
        }

        function calculateFit(v) {
            const resultsDiv = document.getElementById('crop-results');
            if (v.origWidth <= 0 || v.origHeight <= 0 || v.targetWidth <= 0 || v.targetHeight <= 0) {
                resultsDiv.innerHTML = '';
                updateQualityIndicator('fit-quality', 0, 0);
                return;
            }
            const origRatio = v.origWidth / v.origHeight;
            const targetRatio = v.targetWidth / v.targetHeight;
            const unitLabel = currentUnit === 'mm' ? 'mm' : '"';

            if (Math.abs(origRatio - targetRatio) < 0.001) {
                resultsDiv.innerHTML = `<div class="no-crop-message">✓ No cropping needed — aspect ratios match!<br>Scale: ${(v.targetWidth / v.origWidth * 100).toFixed(1)}%</div>`;
                drawFitPreview(v, null);
                updateQualityIndicator('fit-quality', v.targetWidth, v.targetHeight);
                return;
            }

            const cropOptions = [];
            const fitWidthScale = v.targetWidth / v.origWidth;
            const fitWidthNewHeight = v.origHeight * fitWidthScale;
            if (fitWidthNewHeight >= v.targetHeight) {
                const cropHeight = fitWidthNewHeight - v.targetHeight;
                const cropHeightOriginal = cropHeight / fitWidthScale;
                cropOptions.push({ type: 'width', title: 'Fit to Width', description: 'Crop top/bottom', scale: fitWidthScale, scaledWidth: v.targetWidth, scaledHeight: fitWidthNewHeight, cropDimension: 'height', cropAmount: cropHeight, cropAmountOriginal: cropHeightOriginal, percentageLost: (cropHeightOriginal / v.origHeight * 100) });
            }
            const fitHeightScale = v.targetHeight / v.origHeight;
            const fitHeightNewWidth = v.origWidth * fitHeightScale;
            if (fitHeightNewWidth >= v.targetWidth) {
                const cropWidth = fitHeightNewWidth - v.targetWidth;
                const cropWidthOriginal = cropWidth / fitHeightScale;
                cropOptions.push({ type: 'height', title: 'Fit to Height', description: 'Crop left/right', scale: fitHeightScale, scaledWidth: fitHeightNewWidth, scaledHeight: v.targetHeight, cropDimension: 'width', cropAmount: cropWidth, cropAmountOriginal: cropWidthOriginal, percentageLost: (cropWidthOriginal / v.origWidth * 100) });
            }

            let html = '<div class="crop-options">';
            cropOptions.forEach(opt => {
                const isSelected = opt.type === selectedCropOption;
                html += `<div class="crop-option ${isSelected ? 'selected' : ''}" onclick="selectCropOption('${opt.type}')"><h4>${opt.title}</h4><div class="details">${opt.description} • Scale: ${(opt.scale * 100).toFixed(1)}%</div><div class="crop-amount">Crop: ${formatNumber(opt.cropAmountOriginal)} ${unitLabel} (${opt.percentageLost.toFixed(1)}% lost)</div></div>`;
            });
            html += '</div>';
            resultsDiv.innerHTML = html;

            const selected = cropOptions.find(o => o.type === selectedCropOption) || cropOptions[0];
            if (selected) selectedCropOption = selected.type;
            drawFitPreview(v, selected);
            updateQualityIndicator('fit-quality', v.targetWidth, v.targetHeight);
        }

        function getQualityInfo(dpi) {
            if (dpi >= 300) return { rating: 'Very close to source', colour: '#27ae60', description: 'The print will faithfully reproduce what you see on screen. No detail lost at this size.' };
            if (dpi >= 200) return { rating: 'Close to source', colour: '#2ecc71', description: 'Very little loss compared to the source at normal viewing distance.' };
            if (dpi >= 150) return { rating: 'Some softening', colour: '#f1c40f', description: 'Some softening compared to the source. Less noticeable on larger prints viewed from a distance.' };
            if (dpi >= 100) return { rating: 'Noticeable softening', colour: '#e67e22', description: 'Noticeable softening beyond the source. Fine for large prints viewed from several feet away.' };
            return { rating: 'Significant loss', colour: '#c0392b', description: 'Significant loss compared to the source. Pixelation may become visible. Consider a smaller print size.' };
        }

        function updateQualityIndicator(containerId, printWidthInUnits, printHeightInUnits) {
            const container = document.getElementById(containerId);
            if (imagePixelWidth === 0 || imagePixelHeight === 0 || printWidthInUnits <= 0 || printHeightInUnits <= 0) {
                container.style.display = 'none';
                return;
            }

            // Convert print dimensions to inches for DPI calculation
            let printWidthInches, printHeightInches;
            if (currentUnit === 'mm') {
                printWidthInches = printWidthInUnits / 25.4;
                printHeightInches = printHeightInUnits / 25.4;
            } else {
                printWidthInches = printWidthInUnits;
                printHeightInches = printHeightInUnits;
            }

            const dpiW = imagePixelWidth / printWidthInches;
            const dpiH = imagePixelHeight / printHeightInches;
            const effectiveDPI = Math.min(dpiW, dpiH);
            const megapixels = (imagePixelWidth * imagePixelHeight / 1000000).toFixed(1);

            const quality = getQualityInfo(effectiveDPI);

            // Needle position: 0 DPI = left (0%), 400+ DPI = right (100%)
            const needlePercent = Math.min(100, Math.max(0, (effectiveDPI / 400) * 100));

            container.style.display = 'block';
            container.innerHTML = `
                <h3>Print Quality — compared to source</h3>
                <div class="quality-bar-labels">
                    <span>Significant loss</span>
                    <span>Noticeable</span>
                    <span>Some softening</span>
                    <span>Close</span>
                    <span>Very close</span>
                </div>
                <div class="quality-bar-container">
                    <div class="quality-needle" style="left: calc(${needlePercent}% - 2px);"></div>
                </div>
                <div class="quality-details">
                    <span class="quality-dpi-value" style="color: ${quality.colour};">${Math.round(effectiveDPI)} DPI</span>
                    <span class="quality-rating" style="background: ${quality.colour};">${quality.rating}</span>
                </div>
                <div class="quality-description">${quality.description}</div>
                <div class="quality-megapixels">
                    Source: ${imagePixelWidth} × ${imagePixelHeight} px (${megapixels} MP) · 
                    Horizontal: ${Math.round(dpiW)} DPI · Vertical: ${Math.round(dpiH)} DPI
                </div>
            `;
        }

        function selectCropOption(type) {
            selectedCropOption = type;
            cropPositionX = 0.5;
            cropPositionY = 0.5;
            calculate();
        }

        function setupDragHandlers() {
            const canvas = document.getElementById('original-preview');
            canvas.addEventListener('mousedown', startDrag);
            canvas.addEventListener('mousemove', doDrag);
            canvas.addEventListener('mouseup', endDrag);
            canvas.addEventListener('mouseleave', endDrag);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }); });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); doDrag({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }); });
            canvas.addEventListener('touchend', endDrag);
        }

        function startDrag(e) {
            if (!currentCropOption || !canvasDrawInfo) return;
            const canvas = document.getElementById('original-preview');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const info = canvasDrawInfo;
            if (x >= info.keepDrawX && x <= info.keepDrawX + info.keepDrawW && y >= info.keepDrawY && y <= info.keepDrawY + info.keepDrawH) {
                isDragging = true;
                dragStartX = x; dragStartY = y;
                dragStartPosX = cropPositionX; dragStartPosY = cropPositionY;
                canvas.style.cursor = 'grabbing';
            }
        }

        function doDrag(e) {
            if (!isDragging || !currentCropOption || !canvasDrawInfo) return;
            const canvas = document.getElementById('original-preview');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const info = canvasDrawInfo;
            const deltaX = x - dragStartX, deltaY = y - dragStartY;
            if (currentCropOption.cropDimension === 'width') {
                const maxDragPixels = info.origW - info.keepDrawW;
                if (maxDragPixels > 0) cropPositionX = Math.max(0, Math.min(1, dragStartPosX + deltaX / maxDragPixels));
            } else {
                const maxDragPixels = info.origH - info.keepDrawH;
                if (maxDragPixels > 0) cropPositionY = Math.max(0, Math.min(1, dragStartPosY + deltaY / maxDragPixels));
            }
            calculate();
        }

        function endDrag() {
            if (isDragging) {
                isDragging = false;
                document.getElementById('original-preview').style.cursor = 'move';
                if (Math.abs(cropPositionX - 0.5) > 0.01 || Math.abs(cropPositionY - 0.5) > 0.01) {
                    document.getElementById('reset-position-btn').style.display = 'inline-block';
                }
            }
        }

        function resetCropPosition() {
            cropPositionX = 0.5; cropPositionY = 0.5;
            document.getElementById('reset-position-btn').style.display = 'none';
            calculate();
        }

        function drawProportionalPreview(v, newWidth, newHeight) {
            const canvas = document.getElementById('proportional-preview');
            const ctx = canvas.getContext('2d');
            const padding = 15;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let previewOrigW = v.origWidth, previewOrigH = v.origHeight;
            if (uploadedImage && (previewOrigW <= 0 || previewOrigH <= 0)) { previewOrigW = imagePixelWidth; previewOrigH = imagePixelHeight; }
            if (previewOrigW <= 0 || previewOrigH <= 0) { ctx.font = '11px DM Sans'; ctx.fillStyle = '#999'; ctx.textAlign = 'center'; ctx.fillText('Enter dimensions', canvas.width / 2, canvas.height / 2); return; }
            
            let previewNewW = newWidth, previewNewH = newHeight;
            if (previewNewW <= 0 && previewNewH <= 0) { previewNewW = previewOrigW; previewNewH = previewOrigH; }

            const scaleToFit = Math.min((canvas.width - padding * 2) / previewOrigW, (canvas.height - padding * 2) / previewOrigH);
            const origDrawW = previewOrigW * scaleToFit, origDrawH = previewOrigH * scaleToFit;
            const newDrawW = previewNewW * scaleToFit, newDrawH = previewNewH * scaleToFit;
            const origX = (canvas.width - origDrawW) / 2, origY = (canvas.height - origDrawH) / 2;

            if (uploadedImage) {
                ctx.globalAlpha = 0.3;
                ctx.drawImage(uploadedImage, origX, origY, origDrawW, origDrawH);
                ctx.globalAlpha = 1;
                ctx.drawImage(uploadedImage, origX, origY, newDrawW, newDrawH);
                ctx.strokeStyle = '#c9a87c'; ctx.lineWidth = 2;
                ctx.strokeRect(origX, origY, newDrawW, newDrawH);
            } else {
                ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([5, 5]); ctx.strokeRect(origX, origY, origDrawW, origDrawH); ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(201, 168, 124, 0.3)'; ctx.fillRect(origX, origY, newDrawW, newDrawH);
                ctx.strokeStyle = '#c9a87c'; ctx.lineWidth = 2; ctx.strokeRect(origX, origY, newDrawW, newDrawH);
            }
        }

        function drawFitPreview(v, cropOption) {
            const origCanvas = document.getElementById('original-preview');
            const cropCanvas = document.getElementById('crop-preview');
            const origCtx = origCanvas.getContext('2d');
            const cropCtx = cropCanvas.getContext('2d');
            const padding = 10;

            origCtx.clearRect(0, 0, origCanvas.width, origCanvas.height);
            cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
            currentCropOption = cropOption;

            if (!cropOption) {
                const scale = Math.min((origCanvas.width - padding * 2) / v.origWidth, (origCanvas.height - padding * 2) / v.origHeight);
                const w = v.origWidth * scale, h = v.origHeight * scale;
                const x = (origCanvas.width - w) / 2, y = (origCanvas.height - h) / 2;
                origCanvas.classList.remove('interactive'); canvasDrawInfo = null;
                if (uploadedImage) { origCtx.drawImage(uploadedImage, x, y, w, h); cropCtx.drawImage(uploadedImage, x, y, w, h); }
                else { origCtx.fillStyle = 'rgba(201, 168, 124, 0.3)'; origCtx.fillRect(x, y, w, h); cropCtx.fillStyle = 'rgba(201, 168, 124, 0.3)'; cropCtx.fillRect(x, y, w, h); }
                origCtx.strokeStyle = '#c9a87c'; origCtx.lineWidth = 2; origCtx.strokeRect(x, y, w, h);
                cropCtx.strokeStyle = '#c9a87c'; cropCtx.lineWidth = 2; cropCtx.strokeRect(x, y, w, h);
                return;
            }

            origCanvas.classList.add('interactive'); origCanvas.style.cursor = 'move';
            const position = cropOption.cropDimension === 'height' ? cropPositionY : cropPositionX;

            const origScale = Math.min((origCanvas.width - padding * 2) / v.origWidth, (origCanvas.height - padding * 2) / v.origHeight);
            const origW = v.origWidth * origScale, origH = v.origHeight * origScale;
            const origX = (origCanvas.width - origW) / 2, origY = (origCanvas.height - origH) / 2;

            let keepX = 0, keepY = 0, keepW = v.origWidth, keepH = v.origHeight;
            if (cropOption.cropDimension === 'height') { keepH = v.origHeight - cropOption.cropAmountOriginal; keepY = cropOption.cropAmountOriginal * position; }
            else { keepW = v.origWidth - cropOption.cropAmountOriginal; keepX = cropOption.cropAmountOriginal * position; }

            const keepDrawX = origX + keepX * origScale, keepDrawY = origY + keepY * origScale;
            const keepDrawW = keepW * origScale, keepDrawH = keepH * origScale;
            canvasDrawInfo = { origX, origY, origW, origH, keepDrawX, keepDrawY, keepDrawW, keepDrawH, origScale };

            if (uploadedImage) {
                origCtx.globalAlpha = 0.4; origCtx.drawImage(uploadedImage, origX, origY, origW, origH); origCtx.globalAlpha = 1;
                origCtx.save(); origCtx.beginPath(); origCtx.rect(keepDrawX, keepDrawY, keepDrawW, keepDrawH); origCtx.clip();
                origCtx.drawImage(uploadedImage, origX, origY, origW, origH); origCtx.restore();
            } else {
                origCtx.fillStyle = 'rgba(148, 163, 184, 0.3)'; origCtx.fillRect(origX, origY, origW, origH);
                origCtx.fillStyle = 'rgba(201, 168, 124, 0.3)'; origCtx.fillRect(keepDrawX, keepDrawY, keepDrawW, keepDrawH);
            }
            origCtx.strokeStyle = '#c9a87c'; origCtx.lineWidth = 2; origCtx.strokeRect(keepDrawX, keepDrawY, keepDrawW, keepDrawH);

            const cropScale = Math.min((cropCanvas.width - padding * 2) / v.targetWidth, (cropCanvas.height - padding * 2) / v.targetHeight);
            const cropW = v.targetWidth * cropScale, cropH = v.targetHeight * cropScale;
            const cropX = (cropCanvas.width - cropW) / 2, cropY = (cropCanvas.height - cropH) / 2;

            if (uploadedImage) {
                const pixelScaleX = imagePixelWidth / v.origWidth, pixelScaleY = imagePixelHeight / v.origHeight;
                cropCtx.drawImage(uploadedImage, keepX * pixelScaleX, keepY * pixelScaleY, keepW * pixelScaleX, keepH * pixelScaleY, cropX, cropY, cropW, cropH);
            } else {
                cropCtx.fillStyle = 'rgba(201, 168, 124, 0.3)'; cropCtx.fillRect(cropX, cropY, cropW, cropH);
            }
            cropCtx.strokeStyle = '#c9a87c'; cropCtx.lineWidth = 2; cropCtx.strokeRect(cropX, cropY, cropW, cropH);
        }

        calculate();
        setupDragHandlers();
    </script>
</body>
</html>
