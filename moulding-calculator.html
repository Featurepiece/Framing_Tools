<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moulding Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f6f3;
            --bg-secondary: #ffffff;
            --bg-accent: #2c3e50;
            --text-primary: #2c3e50;
            --text-secondary: #6b7c8a;
            --text-light: #ffffff;
            --accent: #c9a87c;
            --accent-hover: #b8956a;
            --border: #e8e4df;
            --shadow: rgba(44, 62, 80, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.2s;
            z-index: 100;
        }

        .menu-btn:hover {
            background: var(--accent);
            color: var(--text-light);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 30px 20px;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .subtitle { color: var(--text-secondary); font-size: 0.95rem; }

        .controls-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .unit-toggle, .mode-toggle {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .unit-toggle button, .mode-toggle button {
            padding: 8px 16px;
            border: none;
            background: var(--bg-secondary);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .unit-toggle button.active, .mode-toggle button.active {
            background: var(--accent);
            color: var(--text-light);
        }

        .unit-toggle button:hover:not(.active), .mode-toggle button:hover:not(.active) {
            background: var(--border);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 800px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px var(--shadow);
            margin-bottom: 16px;
        }

        .panel:last-child { margin-bottom: 0; }

        .panel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
        }

        .input-field { flex: 1; min-width: 80px; }

        .input-field label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .input-field input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-field .unit-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .input-field-full {
            margin-bottom: 14px;
        }

        .input-field-full label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .input-field-full input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-field-full input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-field-full .unit-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .unit-label-fixed {
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 2px;
            font-weight: 500;
        }

        .mount-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .equal-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 14px;
        }

        .equal-button:hover {
            background: var(--border);
        }

        .results {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid var(--accent);
        }

        .result-item {
            text-align: center;
            margin-bottom: 16px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .result-value {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--accent);
        }

        .result-value-secondary {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .result-dimensions {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 600;
            margin-top: 4px;
        }

        .result-dimensions-secondary {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .result-separator {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }

        #placeholder {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            h1 { font-size: 1.75rem; }
            .input-group { flex-direction: column; gap: 10px; }
            .mount-grid { grid-template-columns: 1fr; }
            .result-value { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="menu-btn">← Menu</a>
    <div class="container">
        <header>
            <h1>Moulding Calculator</h1>
            <p class="subtitle">Calculate required moulding length for frames</p>
        </header>

        <div class="controls-row">
            <div class="mode-toggle">
                <button id="btn-direct" class="active" onclick="setMode('direct')">Direct Entry</button>
                <button id="btn-artwork" onclick="setMode('artwork')">Calculate from Artwork</button>
            </div>
            <div class="unit-toggle">
                <button id="btn-mm" class="active" onclick="setUnit('mm')">mm</button>
                <button id="btn-inch" onclick="setUnit('inch')">inches</button>
            </div>
        </div>

        <div class="main-layout">
            <!-- LEFT COLUMN: Inputs -->
            <div class="left-column">
                <!-- DIRECT ENTRY MODE -->
                <div id="direct-mode">
                    <div class="panel">
                        <h2>Glass Size</h2>
                        
                        <div class="input-group">
                            <div class="input-field">
                                <label for="glass-width">Width</label>
                                <input type="number" id="glass-width" min="0" step="0.1" oninput="calculate()">
                                <div class="unit-label">mm</div>
                            </div>
                            <div class="input-field">
                                <label for="glass-height">Height</label>
                                <input type="number" id="glass-height" min="0" step="0.1" oninput="calculate()">
                                <div class="unit-label">mm</div>
                            </div>
                        </div>

                        <div class="input-field-full">
                            <label for="moulding-width">Moulding Width (always mm)</label>
                            <input type="number" id="moulding-width" min="0" step="0.1" oninput="calculate()">
                            <div class="unit-label-fixed">mm</div>
                        </div>
                    </div>
                </div>

                <!-- ARTWORK MODE -->
                <div id="artwork-mode" style="display: none;">
                    <div class="panel">
                        <h2>Artwork Size</h2>
                        
                        <div class="input-group">
                            <div class="input-field">
                                <label for="artwork-width">Width</label>
                                <input type="number" id="artwork-width" min="0" step="0.1" oninput="calculate()">
                                <div class="unit-label">mm</div>
                            </div>
                            <div class="input-field">
                                <label for="artwork-height">Height</label>
                                <input type="number" id="artwork-height" min="0" step="0.1" oninput="calculate()">
                                <div class="unit-label">mm</div>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <h2>Mount Widths</h2>

                        <button class="equal-button" onclick="equalizeMount()">⚡ Equal All Sides</button>
                        
                        <div class="mount-grid">
                            <div class="input-field">
                                <label for="mount-top">Top</label>
                                <input type="number" id="mount-top" min="0" step="0.1" oninput="calculate()">
                                <div class="unit-label">mm</div>
                            </div>
                            <div class="input-field">
                                <label for="mount-bottom">Bottom</label>
                                <input type="number" id="mount-bottom" min="0" step="0.1" oninput="calculate()">
                                <div class="unit-label">mm</div>
                            </div>
                            <div class="input-field">
                                <label for="mount-left">Left</label>
                                <input type="number" id="mount-left" min="0" step="0.1" oninput="calculate()">
                                <div class="unit-label">mm</div>
                            </div>
                            <div class="input-field">
                                <label for="mount-right">Right</label>
                                <input type="number" id="mount-right" min="0" step="0.1" oninput="calculate()">
                                <div class="unit-label">mm</div>
                            </div>
                        </div>

                        <div class="input-field-full">
                            <label for="moulding-width-artwork">Moulding Width (always mm)</label>
                            <input type="number" id="moulding-width-artwork" min="0" step="0.1" oninput="calculate()">
                            <div class="unit-label-fixed">mm</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Results -->
            <div class="panel">
                <h2>Result</h2>
                
                <div id="results-container" style="display: none;">
                    <div class="results">
                        <div id="glass-size-result" style="display: none;">
                            <div class="result-item">
                                <div class="result-label">Calculated Glass Size</div>
                                <div class="result-dimensions" id="glass-size-dimensions">0 × 0 mm</div>
                                <div class="result-dimensions-secondary" id="glass-size-dimensions-secondary"></div>
                            </div>
                            <div class="result-separator"></div>
                        </div>
                        
                        <div class="result-item">
                            <div class="result-label">Total Moulding Length</div>
                            <div class="result-value" id="total-length">0 mm</div>
                            <div class="result-value-secondary" id="total-length-secondary"></div>
                        </div>
                    </div>
                </div>

                <div id="placeholder">
                    <p style="font-size: 0.9rem;">Enter measurements to see results</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUnit = 'mm';
        let currentMode = 'direct';
        const INCH_TO_MM = 25.4;

        function setUnit(unit) {
            currentUnit = unit;
            document.getElementById('btn-mm').classList.toggle('active', unit === 'mm');
            document.getElementById('btn-inch').classList.toggle('active', unit === 'inch');
            
            const unitLabel = unit === 'mm' ? 'mm' : 'inches';
            document.querySelectorAll('.unit-label').forEach(el => el.textContent = unitLabel);
            
            calculate();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-direct').classList.toggle('active', mode === 'direct');
            document.getElementById('btn-artwork').classList.toggle('active', mode === 'artwork');
            
            document.getElementById('direct-mode').style.display = mode === 'direct' ? 'block' : 'none';
            document.getElementById('artwork-mode').style.display = mode === 'artwork' ? 'block' : 'none';
            
            calculate();
        }

        function equalizeMount() {
            const topValue = document.getElementById('mount-top').value;
            if (topValue) {
                document.getElementById('mount-bottom').value = topValue;
                document.getElementById('mount-left').value = topValue;
                document.getElementById('mount-right').value = topValue;
                calculate();
            }
        }

        function showResults(show) {
            document.getElementById('results-container').style.display = show ? 'block' : 'none';
            document.getElementById('placeholder').style.display = show ? 'none' : 'block';
        }

        function formatLength(valueMM) {
            // Always show mm as primary when in mm mode
            // Show both when in inches mode (inches primary, mm secondary)
            if (currentUnit === 'mm') {
                return {
                    primary: `${Math.round(valueMM)} mm`,
                    secondary: null
                };
            } else {
                const inches = valueMM / INCH_TO_MM;
                return {
                    primary: `${inches.toFixed(2)} inches`,
                    secondary: `(${Math.round(valueMM)} mm)`
                };
            }
        }

        function formatDimensions(widthMM, heightMM) {
            if (currentUnit === 'mm') {
                return {
                    primary: `${Math.round(widthMM)} × ${Math.round(heightMM)} mm`,
                    secondary: null
                };
            } else {
                const widthInch = widthMM / INCH_TO_MM;
                const heightInch = heightMM / INCH_TO_MM;
                return {
                    primary: `${widthInch.toFixed(2)} × ${heightInch.toFixed(2)} inches`,
                    secondary: `(${Math.round(widthMM)} × ${Math.round(heightMM)} mm)`
                };
            }
        }

        function calculate() {
            if (currentMode === 'direct') {
                let width = parseFloat(document.getElementById('glass-width').value);
                let height = parseFloat(document.getElementById('glass-height').value);
                let mouldingWidthMM = parseFloat(document.getElementById('moulding-width').value); // Always mm

                if (!width || !height || !mouldingWidthMM || width <= 0 || height <= 0 || mouldingWidthMM <= 0) {
                    showResults(false);
                    return;
                }

                // Convert dimensions to mm if in inches (but NOT moulding width)
                let widthMM = currentUnit === 'inch' ? width * INCH_TO_MM : width;
                let heightMM = currentUnit === 'inch' ? height * INCH_TO_MM : height;

                const totalLengthMM = (heightMM + widthMM) * 2 + (mouldingWidthMM * 8);
                const formatted = formatLength(totalLengthMM);

                document.getElementById('glass-size-result').style.display = 'none';
                document.getElementById('total-length').textContent = formatted.primary;
                document.getElementById('total-length-secondary').textContent = formatted.secondary || '';
                showResults(true);
                
            } else {
                let artworkWidth = parseFloat(document.getElementById('artwork-width').value);
                let artworkHeight = parseFloat(document.getElementById('artwork-height').value);
                let mountTop = parseFloat(document.getElementById('mount-top').value);
                let mountBottom = parseFloat(document.getElementById('mount-bottom').value);
                let mountLeft = parseFloat(document.getElementById('mount-left').value);
                let mountRight = parseFloat(document.getElementById('mount-right').value);
                let mouldingWidthMM = parseFloat(document.getElementById('moulding-width-artwork').value); // Always mm

                if (!artworkWidth || !artworkHeight || !mouldingWidthMM || 
                    artworkWidth <= 0 || artworkHeight <= 0 || mouldingWidthMM <= 0 ||
                    isNaN(mountTop) || isNaN(mountBottom) || isNaN(mountLeft) || isNaN(mountRight) ||
                    mountTop < 0 || mountBottom < 0 || mountLeft < 0 || mountRight < 0) {
                    showResults(false);
                    return;
                }

                // Convert to mm if in inches (but NOT moulding width)
                if (currentUnit === 'inch') {
                    artworkWidth *= INCH_TO_MM;
                    artworkHeight *= INCH_TO_MM;
                    mountTop *= INCH_TO_MM;
                    mountBottom *= INCH_TO_MM;
                    mountLeft *= INCH_TO_MM;
                    mountRight *= INCH_TO_MM;
                }

                const glassWidthMM = artworkWidth + mountLeft + mountRight;
                const glassHeightMM = artworkHeight + mountTop + mountBottom;
                const totalLengthMM = (glassHeightMM + glassWidthMM) * 2 + (mouldingWidthMM * 8);

                const formattedDims = formatDimensions(glassWidthMM, glassHeightMM);
                const formattedLength = formatLength(totalLengthMM);

                document.getElementById('glass-size-dimensions').textContent = formattedDims.primary;
                document.getElementById('glass-size-dimensions-secondary').textContent = formattedDims.secondary || '';
                document.getElementById('glass-size-result').style.display = 'block';
                document.getElementById('total-length').textContent = formattedLength.primary;
                document.getElementById('total-length-secondary').textContent = formattedLength.secondary || '';
                showResults(true);
            }
        }
    </script>
</body>
</html>
