<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featurepiece Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f6f3;
            --bg-secondary: #ffffff;
            --bg-accent: #2c3e50;
            --text-primary: #2c3e50;
            --text-secondary: #6b7c8a;
            --text-light: #ffffff;
            --accent: #c9a87c;
            --accent-hover: #b8956a;
            --border: #e8e4df;
            --shadow: rgba(44, 62, 80, 0.08);
            --shadow-hover: rgba(44, 62, 80, 0.15);
            --danger: #c0392b;
            --success: #27ae60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        @media (max-width: 700px) {
            .tools-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }

        .tool-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: 0 2px 12px var(--shadow);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px var(--shadow-hover);
        }

        .tool-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .tool-name {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .tool-description {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Settings */
        .settings-btn {
            display: block;
            margin: 0 auto;
            padding: 8px 16px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .modal h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .pin-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .pin-input-group input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 4px;
        }

        .pin-input-group input:focus { outline: none; border-color: var(--accent); }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--text-light);
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { background: var(--border); }

        .btn-danger {
            background: rgba(192, 57, 43, 0.1);
            color: var(--danger);
        }

        .btn-danger:hover { background: rgba(192, 57, 43, 0.2); }

        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .settings-tool-list {
            list-style: none;
            margin-bottom: 16px;
        }

        .settings-tool-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .settings-tool-item:last-child { border-bottom: none; }

        .settings-tool-item .tool-item-icon { font-size: 1.2rem; }
        .settings-tool-item .tool-item-name { flex: 1; font-weight: 500; }

        .settings-tool-item .move-btns {
            display: flex;
            gap: 2px;
        }

        .settings-tool-item button {
            padding: 4px 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-tool-item button:hover { background: var(--bg-primary); }

        .add-tool-form {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .add-tool-form label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .add-tool-form input, .add-tool-form textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .add-tool-form input:focus, .add-tool-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .add-tool-form textarea { resize: vertical; height: 60px; }

        .export-import-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Featurepiece Tools</div>
            <p class="tagline">Photography & framing toolkit</p>
        </header>

        <div class="tools-grid" id="tools-grid"></div>

        <button class="settings-btn" onclick="showPinModal()">⚙ Settings</button>
    </div>

    <!-- PIN Modal -->
    <div class="modal-overlay" id="pin-modal">
        <div class="modal">
            <h2>Enter PIN</h2>
            <div class="pin-input-group">
                <input type="password" id="pin-input" maxlength="4" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()">
            </div>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn btn-primary" onclick="checkPin()">Enter</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Manage Tools</h2>

            <ul class="settings-tool-list" id="settings-tool-list"></ul>

            <div class="add-tool-form" id="add-tool-form">
                <h3 style="font-family: 'Playfair Display', serif; font-size: 0.95rem; margin-bottom: 10px;" id="form-title">Add New Tool</h3>
                <label>Name</label>
                <input type="text" id="tool-name" placeholder="e.g. Mount Calculator">
                <label>Filename</label>
                <input type="text" id="tool-file" placeholder="e.g. mount-calculator.html">
                <label>Icon (emoji)</label>
                <input type="text" id="tool-icon" placeholder="e.g. 🖽" maxlength="4">
                <label>Description</label>
                <textarea id="tool-desc" placeholder="Short description of what the tool does"></textarea>
                <div class="btn-row" style="justify-content: flex-start;">
                    <button class="btn btn-primary" id="form-submit-btn" onclick="addTool()">Add Tool</button>
                    <button class="btn btn-secondary" id="form-cancel-btn" onclick="cancelEdit()" style="display:none;">Cancel</button>
                </div>
            </div>

            <div class="export-import-row">
                <button class="btn btn-secondary" onclick="exportData()">Export</button>
                <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">Import</button>
                <input type="file" id="import-file" accept=".json" onchange="importData(event)" style="display:none;">
                <button class="btn btn-danger" onclick="resetData()">Reset</button>
            </div>

            <div class="btn-row">
                <button class="btn btn-secondary" onclick="closeModals()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'featurepiece-tools';

        const defaultData = {
            tools: [
                { id: 1, name: 'Package Pricing', file: 'package-pricing.html', icon: '📦', description: 'Create and price photography packages with markup calculations, category management, and customer-friendly summaries.' },
                { id: 2, name: 'Material Calculator', file: 'material-calculator.html', icon: '✂️', description: 'Calculate material usage and optimise cuts for mounts, frames, and other photography materials.' },
                { id: 3, name: 'Photo Resize Calculator', file: 'photo-resize-calculator.html', icon: '🖼️', description: 'Calculate dimensions and cropping for your prints with DPI conversion and aspect ratio tools.' },
                { id: 4, name: 'Mount Calculator', file: 'mount-calculator.html', icon: '🖽', description: 'Calculate custom mount pricing with options for double mounts, backing boards, and bulk discounts.' },
                { id: 5, name: 'Moulding Calculator', file: 'moulding-calculator.html', icon: '📏', description: 'Calculate required moulding length for frames with cutting optimisation.' }
            ],
            pin: '3786',
            nextToolId: 6
        };

        let data = loadData();
        let editingToolId = null;

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return JSON.parse(JSON.stringify(defaultData));
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function renderTools() {
            const grid = document.getElementById('tools-grid');
            grid.innerHTML = '';
            data.tools.forEach(tool => {
                const card = document.createElement('a');
                card.href = tool.file;
                card.className = 'tool-card';
                card.innerHTML = `
                    <div class="tool-icon">${tool.icon}</div>
                    <div class="tool-name">${tool.name}</div>
                    <div class="tool-description">${tool.description}</div>
                `;
                grid.appendChild(card);
            });
        }

        function renderSettingsList() {
            const list = document.getElementById('settings-tool-list');
            list.innerHTML = '';
            data.tools.forEach((tool, index) => {
                const li = document.createElement('li');
                li.className = 'settings-tool-item';
                li.innerHTML = `
                    <span class="tool-item-icon">${tool.icon}</span>
                    <span class="tool-item-name">${tool.name}</span>
                    <div class="move-btns">
                        <button onclick="moveTool(${index}, -1)" ${index === 0 ? 'disabled' : ''}>↑</button>
                        <button onclick="moveTool(${index}, 1)" ${index === data.tools.length - 1 ? 'disabled' : ''}>↓</button>
                    </div>
                    <button onclick="editTool(${tool.id})">✏️</button>
                    <button onclick="removeTool(${tool.id})">🗑️</button>
                `;
                list.appendChild(li);
            });
        }

        function showPinModal() {
            document.getElementById('pin-modal').classList.add('active');
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-input').focus();
        }

        function checkPin() {
            const input = document.getElementById('pin-input').value;
            if (input === data.pin) {
                document.getElementById('pin-modal').classList.remove('active');
                renderSettingsList();
                document.getElementById('settings-modal').classList.add('active');
            } else {
                document.getElementById('pin-input').value = '';
                document.getElementById('pin-input').placeholder = 'Wrong PIN';
                setTimeout(() => { document.getElementById('pin-input').placeholder = '••••'; }, 1500);
            }
        }

        function closeModals() {
            document.getElementById('pin-modal').classList.remove('active');
            document.getElementById('settings-modal').classList.remove('active');
            cancelEdit();
        }

        function addTool() {
            const name = document.getElementById('tool-name').value.trim();
            const file = document.getElementById('tool-file').value.trim();
            const icon = document.getElementById('tool-icon').value.trim() || '🔧';
            const desc = document.getElementById('tool-desc').value.trim();

            if (!name || !file) return;

            if (editingToolId !== null) {
                const tool = data.tools.find(t => t.id === editingToolId);
                if (tool) {
                    tool.name = name;
                    tool.file = file;
                    tool.icon = icon;
                    tool.description = desc;
                }
                editingToolId = null;
                document.getElementById('form-title').textContent = 'Add New Tool';
                document.getElementById('form-submit-btn').textContent = 'Add Tool';
                document.getElementById('form-cancel-btn').style.display = 'none';
            } else {
                data.tools.push({ id: data.nextToolId++, name, file, icon, description: desc });
            }

            saveData();
            renderTools();
            renderSettingsList();
            clearForm();
        }

        function editTool(id) {
            const tool = data.tools.find(t => t.id === id);
            if (!tool) return;
            editingToolId = id;
            document.getElementById('tool-name').value = tool.name;
            document.getElementById('tool-file').value = tool.file;
            document.getElementById('tool-icon').value = tool.icon;
            document.getElementById('tool-desc').value = tool.description;
            document.getElementById('form-title').textContent = 'Edit Tool';
            document.getElementById('form-submit-btn').textContent = 'Save Changes';
            document.getElementById('form-cancel-btn').style.display = 'inline-block';
        }

        function cancelEdit() {
            editingToolId = null;
            document.getElementById('form-title').textContent = 'Add New Tool';
            document.getElementById('form-submit-btn').textContent = 'Add Tool';
            document.getElementById('form-cancel-btn').style.display = 'none';
            clearForm();
        }

        function clearForm() {
            document.getElementById('tool-name').value = '';
            document.getElementById('tool-file').value = '';
            document.getElementById('tool-icon').value = '';
            document.getElementById('tool-desc').value = '';
        }

        function removeTool(id) {
            if (!confirm('Remove this tool from the menu?')) return;
            data.tools = data.tools.filter(t => t.id !== id);
            saveData();
            renderTools();
            renderSettingsList();
        }

        function moveTool(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= data.tools.length) return;
            const temp = data.tools[index];
            data.tools[index] = data.tools[newIndex];
            data.tools[newIndex] = temp;
            saveData();
            renderTools();
            renderSettingsList();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'featurepiece-tools-backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.tools && Array.isArray(imported.tools)) {
                        data = imported;
                        saveData();
                        renderTools();
                        renderSettingsList();
                    }
                } catch (err) {
                    alert('Invalid file format');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetData() {
            if (!confirm('Reset all tools to defaults? This cannot be undone.')) return;
            data = JSON.parse(JSON.stringify(defaultData));
            saveData();
            renderTools();
            renderSettingsList();
        }

        // Close modals on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) closeModals();
            });
        });

        renderTools();
    </script>
</body>
</html>
