<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featurepiece Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f6f3;
            --bg-secondary: #ffffff;
            --bg-accent: #2c3e50;
            --text-primary: #2c3e50;
            --text-secondary: #6b7c8a;
            --text-light: #ffffff;
            --accent: #c9a87c;
            --accent-hover: #b8956a;
            --border: #e8e4df;
            --shadow: rgba(44, 62, 80, 0.08);
            --shadow-hover: rgba(44, 62, 80, 0.15);
            --danger: #c0392b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 30px 24px; }

        .header-top { display: flex; justify-content: flex-end; margin-bottom: 10px; }

        header { text-align: center; margin-bottom: 30px; }

        .btn {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-settings { background: var(--bg-accent); color: var(--text-light); }
        .btn-settings:hover { background: #3d5166; }
        .btn-primary { background: var(--accent); color: var(--text-light); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-small { padding: 6px 12px; font-size: 0.8rem; }

        .logo {
            width: 80px; height: 80px;
            background: var(--bg-accent);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.5rem;
            box-shadow: 0 4px 20px var(--shadow);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.75rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .subtitle { color: var(--text-secondary); font-size: 1.1rem; }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }

        .tool-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 16px var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tool-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px var(--shadow-hover); }
        .tool-card:hover::before { transform: scaleX(1); }

        .tool-icon {
            width: 56px; height: 56px;
            background: var(--bg-primary);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .tool-card:hover .tool-icon { background: var(--accent); transform: scale(1.05); }

        .tool-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .tool-description { color: var(--text-secondary); font-size: 0.95rem; flex: 1; }

        .tool-arrow {
            margin-top: 20px;
            color: var(--accent);
            font-size: 1.25rem;
            transition: transform 0.3s ease;
            align-self: flex-end;
        }

        .tool-card:hover .tool-arrow { transform: translateX(6px); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); grid-column: 1 / -1; }
        .empty-state-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }

        footer { text-align: center; padding-top: 20px; border-top: 1px solid var(--border); }
        .footer-text { color: var(--text-secondary); font-size: 0.9rem; }
        .version { display: inline-block; background: var(--bg-primary); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; color: var(--text-secondary); margin-top: 12px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 { font-family: 'Playfair Display', serif; margin-bottom: 20px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-size: 0.875rem; color: var(--text-secondary); font-weight: 500; }
        .form-group input, .form-group textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
        .modal-actions .btn { flex: 1; }

        .pin-input { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .pin-input input {
            width: 45px; height: 50px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
        }
        .pin-input input:focus { outline: none; border-color: var(--accent); }

        .pin-error { color: var(--danger); text-align: center; font-size: 0.875rem; margin-top: 8px; display: none; }
        .pin-error.show { display: block; }

        .settings-section { margin-bottom: 24px; }
        .settings-section h4 { font-family: 'Playfair Display', serif; font-size: 1rem; margin-bottom: 12px; }

        .tools-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-primary);
            border-radius: 8px;
        }

        .tool-item-icon { font-size: 1.5rem; width: 40px; text-align: center; }
        .tool-item-info { flex: 1; min-width: 0; }
        .tool-item-name { font-weight: 500; font-size: 0.9rem; }
        .tool-item-file { font-size: 0.75rem; color: var(--text-secondary); }

        .tool-item-actions { display: flex; gap: 4px; }
        .tool-item-actions button {
            width: 28px; height: 28px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem;
            transition: all 0.2s ease;
            background: var(--border);
            color: var(--text-secondary);
        }
        .tool-item-actions button:hover { background: var(--accent); color: var(--text-light); }
        .tool-item-actions button.delete:hover { background: var(--danger); }
        .tool-item-actions button.move { font-size: 0.6rem; }
        .tool-item-actions button:disabled { opacity: 0.3; cursor: not-allowed; }
        .tool-item-actions button:disabled:hover { background: var(--border); color: var(--text-secondary); }

        .data-buttons { display: flex; gap: 8px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

        .save-status { font-size: 0.8rem; color: var(--text-secondary); text-align: center; margin-top: 12px; }
        .save-status.saved { color: var(--accent); }

        #importInput { display: none; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in { animation: fadeInUp 0.5s ease forwards; opacity: 0; }

        @media (max-width: 600px) {
            .container { padding: 40px 16px; }
            h1 { font-size: 2rem; }
            .tools-grid { gap: 16px; }
            .tool-card { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <button class="btn btn-settings" onclick="openPinModal()">⚙️ Settings</button>
        </div>
        
        <header class="animate-in">
            <h1>Featurepiece Tools</h1>
            <p class="subtitle">Your workspace for pricing, calculations & more</p>
        </header>

        <div class="tools-grid" id="toolsGrid"></div>

        <footer class="animate-in" style="animation-delay: 0.3s;">
            <p class="footer-text">Featurepiece Frames</p>
        </footer>
    </div>

    <div class="modal-overlay" id="pinModal">
        <div class="modal">
            <h3>Enter PIN</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; text-align: center;">Enter your PIN to access settings</p>
            <div class="pin-input">
                <input type="password" maxlength="1" id="pin1" oninput="handlePinInput(this, 'pin2')" onkeydown="handlePinKeydown(event, this, null)">
                <input type="password" maxlength="1" id="pin2" oninput="handlePinInput(this, 'pin3')" onkeydown="handlePinKeydown(event, this, 'pin1')">
                <input type="password" maxlength="1" id="pin3" oninput="handlePinInput(this, 'pin4')" onkeydown="handlePinKeydown(event, this, 'pin2')">
                <input type="password" maxlength="1" id="pin4" oninput="handlePinInput(this, null)" onkeydown="handlePinKeydown(event, this, 'pin3')">
            </div>
            <p class="pin-error" id="pinError">Incorrect PIN. Please try again.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closePinModal()">Cancel</button>
                <button class="btn btn-primary" onclick="verifyPin()">Enter</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙️ Settings</h3>
            <div class="settings-section">
                <h4>Tools</h4>
                <div class="tools-list" id="toolsList"></div>
                <button class="btn btn-primary btn-small" onclick="openAddToolModal()">+ Add Tool</button>
            </div>
            <div class="data-buttons">
                <button class="btn btn-secondary btn-small" onclick="exportData()">📁 Export</button>
                <button class="btn btn-secondary btn-small" onclick="document.getElementById('importInput').click()">📂 Import</button>
                <input type="file" id="importInput" accept=".json" onchange="importData(event)">
            </div>
            <p class="save-status" id="saveStatus">Auto-saved to browser</p>
            <div class="modal-actions" style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="closeSettingsModal()">Done</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="toolModal">
        <div class="modal">
            <h3 id="toolModalTitle">Add Tool</h3>
            <div class="form-group">
                <label>Tool Name</label>
                <input type="text" id="toolName" placeholder="e.g. Package Pricing">
            </div>
            <div class="form-group">
                <label>Filename</label>
                <input type="text" id="toolFile" placeholder="e.g. package-pricing.html">
            </div>
            <div class="form-group">
                <label>Icon (emoji)</label>
                <input type="text" id="toolIcon" placeholder="e.g. 📦" maxlength="4">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="toolDescription" placeholder="Brief description of what this tool does"></textarea>
            </div>
            <input type="hidden" id="toolEditId">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeToolModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveTool()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'featurepiece-tools-menu';
        
        const defaultData = {
            tools: [
                { id: 1, name: 'Package Pricing', file: 'package-pricing.html', icon: '📦', description: 'Create and price photography packages with markup calculations, category management, and customer-friendly summaries.' },
                { id: 2, name: 'Material Calculator', file: 'material-calculator.html', icon: '✂️', description: 'Calculate material usage and optimise cuts for mounts, frames, and other photography materials.' },
                { id: 3, name: 'Photo Resize Calculator', file: 'photo-resize-calculator.html', icon: '🖼️', description: 'Calculate dimensions and cropping for your prints with DPI conversion and aspect ratio tools.' },
                { id: 4, name: 'Mount Calculator', file: 'mount-calculator.html', icon: '🖽', description: 'Calculate custom mount pricing with options for double mounts, backing boards, and bulk discounts.' },
                { id: 5, name: 'Moulding Calculator', file: 'moulding-calculator.html', icon: '📏', description: 'Calculate required moulding length for frames.' }
            ],
            pin: '3786',
            nextToolId: 6
        };

        let data = { ...defaultData };
        let nextToolId = data.nextToolId;

        // Load from localStorage on startup
        function loadFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    data.tools = parsed.tools || defaultData.tools;
                    data.pin = parsed.pin || defaultData.pin;
                    nextToolId = parsed.nextToolId || defaultData.nextToolId;
                }
            } catch (e) {
                console.log('No saved data found, using defaults');
            }
        }

        // Save to localStorage
        function saveToStorage() {
            try {
                const saveObj = {
                    tools: data.tools,
                    pin: data.pin,
                    nextToolId: nextToolId
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(saveObj));
                updateSaveStatus('✓ Saved');
            } catch (e) {
                console.error('Failed to save:', e);
                updateSaveStatus('Save failed');
            }
        }

        function updateSaveStatus(message) {
            const status = document.getElementById('saveStatus');
            status.textContent = message;
            status.classList.add('saved');
            setTimeout(() => {
                status.textContent = 'Auto-saved to browser';
                status.classList.remove('saved');
            }, 2000);
        }

        function init() {
            loadFromStorage();
            renderToolsGrid();
        }

        function renderToolsGrid() {
            const grid = document.getElementById('toolsGrid');
            if (data.tools.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔧</div><p>No tools yet. Open Settings to add your first tool.</p></div>';
                return;
            }
            grid.innerHTML = data.tools.map((tool, i) => `
                <a href="${escapeHtml(tool.file)}" class="tool-card animate-in" style="animation-delay: ${0.1 + i * 0.1}s;">
                    <div class="tool-icon"><span>${tool.icon}</span></div>
                    <div class="tool-name">${escapeHtml(tool.name)}</div>
                    <div class="tool-description">${escapeHtml(tool.description)}</div>
                    <div class="tool-arrow">→</div>
                </a>
            `).join('');
        }

        function renderToolsList() {
            const list = document.getElementById('toolsList');
            if (data.tools.length === 0) {
                list.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.9rem; padding: 12px;">No tools added yet.</p>';
                return;
            }
            list.innerHTML = data.tools.map((tool, i) => `
                <div class="tool-item">
                    <div class="tool-item-icon">${tool.icon}</div>
                    <div class="tool-item-info">
                        <div class="tool-item-name">${escapeHtml(tool.name)}</div>
                        <div class="tool-item-file">${escapeHtml(tool.file)}</div>
                    </div>
                    <div class="tool-item-actions">
                        <button class="move" onclick="moveTool(${tool.id}, -1)" title="Move up" ${i === 0 ? 'disabled' : ''}>▲</button>
                        <button class="move" onclick="moveTool(${tool.id}, 1)" title="Move down" ${i === data.tools.length - 1 ? 'disabled' : ''}>▼</button>
                        <button onclick="openEditToolModal(${tool.id})" title="Edit">✏️</button>
                        <button class="delete" onclick="deleteTool(${tool.id})" title="Delete">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function moveTool(toolId, direction) {
            const index = data.tools.findIndex(t => t.id === toolId);
            if (index === -1) return;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= data.tools.length) return;
            [data.tools[index], data.tools[newIndex]] = [data.tools[newIndex], data.tools[index]];
            renderToolsList();
            saveToStorage();
        }

        function deleteTool(toolId) {
            if (!confirm('Remove this tool from the menu?')) return;
            data.tools = data.tools.filter(t => t.id !== toolId);
            renderToolsList();
            saveToStorage();
        }

        function openPinModal() {
            document.getElementById('pinModal').classList.add('active');
            ['pin1','pin2','pin3','pin4'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('pinError').classList.remove('show');
            document.getElementById('pin1').focus();
        }

        function closePinModal() { document.getElementById('pinModal').classList.remove('active'); }

        function handlePinInput(current, nextId) {
            if (current.value.length === 1 && nextId) document.getElementById(nextId).focus();
            if (!nextId && current.value.length === 1) verifyPin();
        }

        function handlePinKeydown(event, current, prevId) {
            if (event.key === 'Backspace' && current.value === '' && prevId) document.getElementById(prevId).focus();
        }

        function verifyPin() {
            const entered = ['pin1','pin2','pin3','pin4'].map(id => document.getElementById(id).value).join('');
            if (entered === data.pin) { closePinModal(); openSettingsModal(); }
            else {
                document.getElementById('pinError').classList.add('show');
                ['pin1','pin2','pin3','pin4'].forEach(id => document.getElementById(id).value = '');
                document.getElementById('pin1').focus();
            }
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.add('active');
            renderToolsList();
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('active');
            renderToolsGrid();
        }

        function openAddToolModal() {
            document.getElementById('toolModalTitle').textContent = 'Add Tool';
            ['toolName','toolFile','toolIcon','toolDescription','toolEditId'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('toolModal').classList.add('active');
        }

        function openEditToolModal(toolId) {
            const tool = data.tools.find(t => t.id === toolId);
            if (!tool) return;
            document.getElementById('toolModalTitle').textContent = 'Edit Tool';
            document.getElementById('toolName').value = tool.name;
            document.getElementById('toolFile').value = tool.file;
            document.getElementById('toolIcon').value = tool.icon;
            document.getElementById('toolDescription').value = tool.description;
            document.getElementById('toolEditId').value = toolId;
            document.getElementById('toolModal').classList.add('active');
        }

        function closeToolModal() { document.getElementById('toolModal').classList.remove('active'); }

        function saveTool() {
            const name = document.getElementById('toolName').value.trim();
            const file = document.getElementById('toolFile').value.trim();
            const icon = document.getElementById('toolIcon').value.trim() || '🔧';
            const description = document.getElementById('toolDescription').value.trim();
            const editId = document.getElementById('toolEditId').value;

            if (!name) { alert('Please enter a tool name'); return; }
            if (!file) { alert('Please enter a filename'); return; }

            if (editId) {
                const tool = data.tools.find(t => t.id === parseInt(editId));
                if (tool) { tool.name = name; tool.file = file; tool.icon = icon; tool.description = description; }
            } else {
                data.tools.push({ id: nextToolId++, name, file, icon, description });
            }
            closeToolModal();
            renderToolsList();
            saveToStorage();
        }

        function exportData() {
            const exportObj = { tools: data.tools, pin: data.pin, nextToolId, exportDate: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `featurepiece-tools-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const obj = JSON.parse(e.target.result);
                    if (!obj.tools) throw new Error('Invalid');
                    data.tools = obj.tools;
                    data.pin = obj.pin || '3786';
                    nextToolId = obj.nextToolId || Math.max(...data.tools.map(t => t.id), 0) + 1;
                    renderToolsList();
                    renderToolsGrid();
                    saveToStorage();
                    alert('Imported successfully!');
                } catch (err) { alert('Error importing file.'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        ['pinModal','settingsModal','toolModal'].forEach(id => {
            document.getElementById(id).addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        });

        init();
    </script>
</body>
</html>
